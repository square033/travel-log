<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>트립로그</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#3182F6; --blue-dark:#1B64DA; --blue-bg:#E8F3FF;
  --red:#F04452; --green:#00C473; --orange:#FF9F0A;
  --g900:#191F28; --g700:#333D4B; --g600:#4E5968; --g500:#6B7684;
  --g400:#8B95A1; --g300:#B0B8C1; --g200:#D1D6DB; --g100:#E5E8EB;
  --g50:#F2F4F6; --g25:#F9FAFB; --white:#FFFFFF;
  --r-lg:20px; --r-md:16px; --r-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--g50); color:var(--g900);
  max-width:520px; margin:0 auto; position:relative;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;letter-spacing:inherit}
input,textarea,select{font-family:inherit;letter-spacing:inherit;border:none;outline:none;background:none;color:var(--g900)}
input::placeholder,textarea::placeholder{color:var(--g300)}
a{color:var(--blue);text-decoration:none}

/* ---------- layout ---------- */
.page{display:none;padding:0 20px 110px;min-height:100vh}
.page.on{display:block}
.topbar{padding:18px 0 6px}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.topbar .sub{font-size:13px;color:var(--g400);margin-top:3px;font-weight:500}
.title-edit{font-size:24px;font-weight:800;width:100%;letter-spacing:-0.02em}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--g100);display:flex;z-index:1000;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--g300);font-size:10.5px;font-weight:600;transition:color .15s}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--g900)}

/* ---------- cards & common ---------- */
.card{background:var(--white);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(2,32,71,.04)}
.section-t{font-size:15px;font-weight:700;color:var(--g700);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.section-t .cnt{color:var(--blue);margin-left:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:15px;border-radius:var(--r-md);font-size:16px;font-weight:700;transition:transform .1s, filter .15s}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:active{background:var(--blue-dark)}
.btn-grey{background:var(--g50);color:var(--g600)}
.btn-ghost{background:var(--blue-bg);color:var(--blue)}
.chip-add{background:var(--g50);color:var(--g500);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px}
.empty{padding:44px 20px;text-align:center;color:var(--g400);font-size:14px;font-weight:500;line-height:1.6}
.empty .emo{font-size:34px;display:block;margin-bottom:10px}
.field{background:var(--g50);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.field input,.field textarea{flex:1;font-size:15.5px;font-weight:500;background:none}
.field textarea{resize:none;line-height:1.5}
.field .lab{font-size:13px;font-weight:600;color:var(--g400);flex-shrink:0;min-width:44px}
.row-del{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--g300);flex-shrink:0}
.row-del:active{background:var(--g50);color:var(--red)}
.thumb{width:100%;border-radius:var(--r-sm);margin-top:10px;display:block;max-height:220px;object-fit:cover}
.linkline{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--blue);margin-top:8px;background:var(--blue-bg);padding:6px 11px;border-radius:999px;max-width:100%}
.linkline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.linkline.gmap{background:#E7F8F0;color:#00A661}
.memoline{font-size:13.5px;color:var(--g500);line-height:1.55;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--g200);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff}
.check.on{background:var(--blue);border-color:var(--blue)}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .15s}
.check.on svg{opacity:1;transform:scale(1)}
.done .it-name{text-decoration:line-through;color:var(--g300)}

/* ---------- itinerary ---------- */
#map{height:44vh;min-height:300px;border-radius:var(--r-lg);margin-bottom:14px;z-index:1;box-shadow:0 1px 3px rgba(2,32,71,.06)}
.daychips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex-shrink:0;padding:8px 15px;border-radius:16px;background:var(--white);color:var(--g500);font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(2,32,71,.05);transition:all .15s;line-height:1.25;text-align:center}
.dchip .dd{display:block;font-size:10.5px;font-weight:600;opacity:.62;margin-top:3px}
.day-head .dsub{display:inline-block;font-size:13px;font-weight:600;color:var(--g400);margin-left:9px}
.moveday{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.moveday button{padding:8px 13px;border-radius:999px;background:var(--g50);font-size:13.5px;font-weight:700;color:var(--g500);line-height:1.3}
.moveday button.on{background:var(--g900);color:#fff}
.moveday button .dd{display:block;font-size:10px;font-weight:600;opacity:.6;margin-top:2px}
.dchip.on{background:var(--g900);color:#fff}
.dchip.plus{color:var(--blue);background:var(--blue-bg);box-shadow:none}
.stop{display:flex;gap:12px;position:relative}
.stop-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.stop-dot{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop-line{width:2px;flex:1;background:var(--g100);margin:4px 0;border-radius:2px}
.stop:last-child .stop-line{display:none}
.stop-body{flex:1;padding-bottom:18px;min-width:0}
.stop:last-child .stop-body{padding-bottom:4px}
.stop-time{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:2px}
.stop-name{font-size:16px;font-weight:700;word-break:break-word}
.stop-addr{font-size:12px;color:var(--g400);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-acts{display:flex;gap:2px;flex-shrink:0}
.mini{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--g300)}
.mini:active{background:var(--g50);color:var(--g600)}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.day-head b{font-size:17px;font-weight:800}
.day-del{font-size:12.5px;font-weight:600;color:var(--g400)}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--g100);border-radius:14px;padding:4px;margin:14px 0 4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:14.5px;font-weight:700;color:var(--g400);transition:all .15s}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(2,32,71,.08)}

/* ---------- budget ---------- */
.bud-hero{background:var(--g900);border-radius:var(--r-lg);padding:24px 22px;color:#fff;margin-bottom:12px}
.bud-hero .cap{font-size:13px;font-weight:600;color:rgba(255,255,255,.55)}
.bud-hero .amt{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-0.02em}
.bud-hero .amt.over{color:#FF8B95}
.bud-bar{height:8px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:18px;overflow:hidden}
.bud-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bud-fill.over{background:var(--red)}
.bud-meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.55);margin-top:9px}
.exp-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--g50)}
.exp-row:last-child{border-bottom:none}
.exp-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--g50)}
.exp-name{font-size:15px;font-weight:600;flex:1;min-width:0}
.exp-cat{font-size:12px;color:var(--g400);font-weight:500;margin-top:1px}
.exp-amt{font-size:15.5px;font-weight:700;flex-shrink:0}
.catpick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.catpick button{padding:8px 13px;border-radius:999px;background:var(--g50);font-size:13.5px;font-weight:600;color:var(--g500)}
.catpick button.on{background:var(--g900);color:#fff}

/* ---------- docs ---------- */
.doc-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.doc-tabs::-webkit-scrollbar{display:none}

/* ---------- bottom sheet ---------- */
.dim{position:fixed;inset:0;background:rgba(25,31,40,.5);z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:520px;
  background:#fff;border-radius:24px 24px 0 0;z-index:2001;transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sheet-hd{padding:20px 22px 8px;flex-shrink:0}
.sheet-grip{width:38px;height:4px;background:var(--g200);border-radius:99px;margin:0 auto 16px}
.sheet-hd h2{font-size:19px;font-weight:800}
.sheet-bd{padding:12px 22px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.sr{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--g50);width:100%;text-align:left}
.sr:active{background:var(--g25)}
.sr .pin{width:36px;height:36px;border-radius:12px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr b{font-size:15px;font-weight:700;display:block}
.sr small{font-size:12px;color:var(--g400);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.imgpick{border:1.5px dashed var(--g200);border-radius:var(--r-sm);padding:16px;text-align:center;color:var(--g400);font-size:14px;font-weight:600;width:100%;margin-bottom:10px}
.imgpick img{max-height:130px;border-radius:8px;display:block;margin:0 auto}
.searching{padding:26px;text-align:center;color:var(--g400);font-size:14px;font-weight:500}

/* google maps */
#map .map-off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:var(--r-lg);color:var(--g400);font-size:13.5px;font-weight:600;text-align:center;line-height:1.6;padding:20px}
#map .map-off .emo{font-size:32px}
.gm-style{font-family:inherit!important}
.acbox{margin-bottom:10px;--gmp-mat-color-surface:#fff}
.acbox gmp-place-autocomplete{width:100%;border-radius:12px;overflow:hidden}
.pac-container{z-index:3005!important;border-radius:14px;border:none;box-shadow:0 8px 24px rgba(2,32,71,.16);margin-top:6px;font-family:inherit;padding:4px}
.pac-item{border:none;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--g500);cursor:pointer}
.pac-item:hover,.pac-item-selected{background:var(--g50)}
.pac-item-query{font-size:15px;font-weight:700;color:var(--g900)}
.pac-icon{display:none}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--g900);color:#fff;
  padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:3000;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.gate{position:fixed;inset:0;background:var(--g50);z-index:2500;display:none;overflow-y:auto;padding:0 20px}
.gate.on{display:block}
.gate-in{max-width:480px;margin:0 auto;padding:64px 0 40px}
.gate-logo{font-size:44px;margin-bottom:10px}
.gate-t{font-size:26px;font-weight:800;letter-spacing:-0.02em}
.gate-s{font-size:14px;color:var(--g400);font-weight:500;margin:6px 0 24px}
.gate-err{font-size:13px;font-weight:600;color:var(--red);padding:0 4px 12px;min-height:18px;line-height:1.5}
.trip-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r-md);padding:16px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 1px 2px rgba(2,32,71,.04)}
.trip-row:active{background:var(--g25)}
.trip-row .ic{width:42px;height:42px;border-radius:13px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.trip-row b{font-size:16px;font-weight:700;display:block}
.trip-row small{font-size:12px;color:var(--g400);display:block;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--g50);color:var(--g400)}
.sync.ok{background:#E7F8F0;color:#00A661}
.sync.saving{background:var(--blue-bg);color:var(--blue)}
.sync.err{background:#FEECEE;color:var(--red)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sharebtn{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:4px 10px;border-radius:999px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ===== 일정 ===== -->
<div class="page on" id="pg-plan">
  <div class="topbar">
    <input class="title-edit" id="tripTitle" placeholder="여행 이름 ✈️" maxlength="30">
    <div class="sub" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button id="dateBtn" class="sharebtn" style="background:var(--g50);color:var(--g500)">여행 날짜</button>
      <span id="syncState" class="sync">연결 중…</span>
      <button id="shareBtn" class="sharebtn">링크 공유</button>
    </div>
  </div>
  <div id="map"></div>
  <div class="daychips" id="dayChips"></div>
  <div class="card">
    <div class="day-head">
      <b id="dayTitle">Day 1</b>
      <button class="day-del" id="dayDel">이 날짜 삭제</button>
    </div>
    <div id="stopList"></div>
    <button class="btn btn-ghost" id="addStopBtn" style="margin-top:14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      장소 추가
    </button>
  </div>
</div>

<!-- ===== 맛집 ===== -->
<div class="page" id="pg-food">
  <div class="topbar"><h1>맛집 리스트</h1><div class="sub">가고 싶은 곳, 계속 모아두세요</div></div>
  <div id="foodList"></div>
  <button class="btn btn-blue" id="addFoodBtn" style="margin-top:6px">맛집 추가하기</button>
</div>

<!-- ===== 쇼핑 ===== -->
<div class="page" id="pg-shop">
  <div class="topbar"><h1>쇼핑</h1><div class="sub">살 것들과 갈 곳들을 한 번에</div></div>
  <div class="seg">
    <button class="on" data-shopseg="items">🛍️ 살 것</button>
    <button data-shopseg="places">📍 쇼핑 장소</button>
  </div>
  <div id="shopItemsWrap">
    <div id="shopItemList"></div>
    <button class="btn btn-blue" id="addShopItemBtn" style="margin-top:6px">살 것 추가하기</button>
  </div>
  <div id="shopPlacesWrap" style="display:none">
    <div id="shopPlaceList"></div>
    <button class="btn btn-blue" id="addShopPlaceBtn" style="margin-top:6px">쇼핑 장소 추가하기</button>
  </div>
</div>

<!-- ===== 예산 ===== -->
<div class="page" id="pg-budget">
  <div class="topbar"><h1>예산</h1><div class="sub">얼마 썼는지 한눈에</div></div>
  <div class="bud-hero">
    <div class="cap">남은 예산</div>
    <div class="amt" id="budRemain">0원</div>
    <div class="bud-bar"><div class="bud-fill" id="budFill" style="width:0%"></div></div>
    <div class="bud-meta"><span id="budSpent">쓴 돈 0원</span><span id="budTotal" style="cursor:pointer">총 예산 설정 ›</span></div>
  </div>
  <div class="section-t">지출 내역<span class="cnt" id="expCnt"></span></div>
  <div class="card" id="expList"></div>
  <button class="btn btn-blue" id="addExpBtn">지출 추가하기</button>
</div>

<!-- ===== 정보 ===== -->
<div class="page" id="pg-docs">
  <div class="topbar"><h1>여행 정보</h1><div class="sub">항공권부터 체크인까지, 흩어지지 않게</div></div>
  <div class="doc-tabs" id="docTabs"></div>
  <div id="docList"></div>
  <button class="btn btn-blue" id="addDocBtn" style="margin-top:6px">정보 추가하기</button>
</div>

<!-- ===== nav ===== -->
<nav class="nav">
  <button data-nav="plan" class="on">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.1 7-11a7 7 0 1 0-14 0c0 5.9 7 11 7 11Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.6" fill="currentColor"/></svg>일정</button>
  <button data-nav="food">
    <svg viewBox="0 0 24 24" fill="none"><path d="M7 3v7M4 3v4a3 3 0 0 0 6 0V3M7 13v8M17 3c-1.7 0-3 2-3 5 0 2 1 3.5 2 4v9M17 3c1 0 2 2 2 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>맛집</button>
  <button data-nav="shop">
    <svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12l1 12a1.5 1.5 0 0 1-1.5 1.6h-11A1.5 1.5 0 0 1 5 20L6 8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 10V6a3 3 0 0 1 6 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>쇼핑</button>
  <button data-nav="budget">
    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="14.5" r="1.4" fill="currentColor"/></svg>예산</button>
  <button data-nav="docs">
    <svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8a2 2 0 0 1 2 2v16l-6-3-6 3V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>정보</button>
</nav>

<!-- 로그인 게이트 -->
<div class="gate" id="authGate">
  <div class="gate-in">
    <div class="gate-logo">🧳</div>
    <h1 class="gate-t">트립로그</h1>
    <p class="gate-s" id="authSub">아이디와 비밀번호로 시작하세요</p>
    <div class="field"><span class="lab">아이디</span><input id="au-id" placeholder="영문·숫자" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><span class="lab">비번</span><input id="au-pw" type="password" placeholder="4자리 이상" autocomplete="current-password" inputmode="numeric"></div>
    <div class="gate-err" id="au-err"></div>
    <button class="btn btn-blue" id="au-go">로그인</button>
    <button class="btn btn-grey" id="au-swap" style="margin-top:8px">처음이신가요? 회원가입</button>
  </div>
</div>

<!-- 여행 선택 게이트 -->
<div class="gate" id="tripGate">
  <div class="gate-in">

/* ===== Supabase 설정 =====
   1) supabase.com 프로젝트 생성 → SQL Editor에 아래 전체 실행:

create extension if not exists pgcrypto;

create table trips (
  code text primary key,
  data jsonb default '{}'::jsonb,
  owner_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  join_secret text not null default encode(gen_random_bytes(8),'hex'),
  updated_at timestamptz default now()
);
create table trip_members (
  code text not null references trips(code) on delete cascade,
  user_id uuid not null references auth.users(id) on delete cascade,
  primary key (code, user_id)
);
alter table trips enable row level security;
alter table trip_members enable row level security;

create or replace function is_member(t text) returns boolean
language sql security definer stable as $$
  select exists(select 1 from trip_members m where m.code=t and m.user_id=auth.uid());
$$;

create policy "trip read"   on trips for select using (owner_id=auth.uid() or is_member(code));
create policy "trip insert" on trips for insert with check (owner_id=auth.uid());
create policy "trip update" on trips for update using (owner_id=auth.uid() or is_member(code));
create policy "trip delete" on trips for delete using (owner_id=auth.uid());
create policy "mem read"    on trip_members for select using (user_id=auth.uid());
create policy "mem leave"   on trip_members for delete using (user_id=auth.uid());

create or replace function join_trip(p_code text, p_secret text) returns boolean
language plpgsql security definer as $$
begin
  if not exists(select 1 from trips where code=p_code and join_secret=p_secret) then
    return false;
  end if;
  insert into trip_members(code,user_id) values(p_code,auth.uid()) on conflict do nothing;
  return true;
end; $$;

   2) Authentication → Sign In / Providers → Email 에서
      "Confirm email" 끄기 (아이디 로그인이라 인증메일이 필요 없어요)
   3) Settings → API 에서 아래 두 값 붙여넣기                       */

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtb2RqZ2x6aHVidnZxbHlnZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTA3MDksImV4cCI6MjEwMjYyNjcwOX0.9-bmgGi5ECizgIgRmujCudjkXh4_mA5zEslvisnd_EE';

const ID_DOMAIN='@example.com', PW_PAD='::tripmate-9f2a';  // .local 등 예약 TLD는 Supabase가 거부해요
const toEmail=id=>id.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+ID_DOMAIN;
const toPw=pw=>pw+PW_PAD;
const fromEmail=e=>(e||'').split('@')[0];

let session=null, CODE=null, myName='';
const SKEY='tripmate-session';
function saveSession(x){session=x;try{localStorage.setItem(SKEY,JSON.stringify(x));}catch(e){}}
function clearSession(){session=null;try{localStorage.removeItem(SKEY);}catch(e){}}
function loadSession(){try{session=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){session=null;}}

function hdrs(){
  return {'apikey':SUPABASE_KEY,'Content-Type':'application/json',
    'Authorization':'Bearer '+(session&&session.access_token?session.access_token:SUPABASE_KEY)};
}
async function api(path,opts){
  opts=opts||{};
  let r=await fetch(SUPABASE_URL+path,{...opts,headers:{...hdrs(),...(opts.headers||{})}});
  if(r.status===401&&session&&session.refresh_token){
    if(await doRefresh()) r=await fetch(SUPABASE_URL+path,{...opts,headers:{...hdrs(),...(opts.headers||{})}});
  }
  return r;
}
async function doRefresh(){
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok){clearSession();return false;}
    const j=await r.json();saveSession(j);return true;
  }catch(e){return false;}
}
async function authRequest(kind,id,pw){
  const path=kind==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const r=await fetch(SUPABASE_URL+path,{
    method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:toEmail(id),password:toPw(pw)})});
  const j=await r.json();
  if(!r.ok||j.error){
    const m=(j.error_description||j.msg||j.message||'').toLowerCase();
    if(m.includes('invalid login')) throw new Error('아이디 또는 비밀번호가 맞지 않아요');
    if(m.includes('already registered')||m.includes('already been')) throw new Error('이미 있는 아이디예요. 로그인해 주세요');
    if(m.includes('confirm')) throw new Error('Supabase에서 "Confirm email"을 꺼주세요');
    throw new Error(j.msg||j.error_description||'요청에 실패했어요');
  }
  if(!j.access_token) throw new Error('가입은 됐지만 자동 로그인에 실패했어요. 로그인해 주세요');
  saveSession(j);
  myName=id.trim().toLowerCase();
  return j;
}

const LASTKEY='tripmate-lasttrip';
async function afterLogin(){
  const u=new URL(location.href);
  let code=u.searchParams.get('trip');
  const k=u.searchParams.get('k');
  if(code&&k){ try{ await api('/rest/v1/rpc/join_trip',{method:'POST',body:JSON.stringify({p_code:code,p_secret:k})}); }catch(e){} }
  /* 주소에 여행이 없으면 마지막에 보던 여행으로 복귀 */
  if(!code){ try{ code=localStorage.getItem(LASTKEY)||''; }catch(e){} if(code) setUrlCode(code); }
  if(code){ CODE=code; return openTrip(); }
  return showTripList();
}
function setUrlCode(c){
  const u=new URL(location.href);u.searchParams.set('trip',c);u.searchParams.delete('k');
  history.replaceState(null,'',u);
}
async function showTripList(){

  $('#tg-who').textContent=nm?nm+'님, 어디로 떠나볼까요?':'어디로 떠나볼까요?';
  const w=$('#tg-list');w.innerHTML='<div class="empty">불러오는 중…</div>';
  try{
    const r=await api('/rest/v1/trips?select=code,data,updated_at&order=updated_at.desc');

/* ---------- 데이터 ---------- */
function setSync(state,text){
  const el=$('#syncState');if(!el)return;
  el.className='sync '+state;
  el.innerHTML='<span class="dot"></span>'+text;
}
async function load(){
  try{
    if(cloudOn()){
      const r=await api('/rest/v1/trips?code=eq.'+encodeURIComponent(CODE)+'&select=data');
      const rows=await r.json();
      if(rows[0]&&rows[0].data) S={...S,...rows[0].data};
      setSync('ok','자동 저장 중');
    }else if(window.storage){
      const r=await window.storage.get(KEY);
      if(r&&r.value) S={...S,...JSON.parse(r.value)};
      setSync('','이 기기에만 저장');
    }else{
      const v=localStorage.getItem(KEY);
      if(v) S={...S,...JSON.parse(v)};
      setSync('','이 기기에만 저장');
    }
  }catch(e){ setSync('err','불러오기 실패'); }
  if(!S.days||!S.days.length) S=Object.assign(S,{days:[{stops:[]}]});
  if(!S.cats) S.cats={budget:[],docs:[]};
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  if(cloudOn()) setSync('saving','저장 중…');
  saveTimer=setTimeout(async()=>{
    const v=JSON.stringify(S);
    try{ localStorage.setItem(KEY+':'+CODE,v); }catch(e){}
    try{
      if(cloudOn()){
        const r=await api('/rest/v1/trips?code=eq.'+encodeURIComponent(CODE),{
          method:'PATCH',body:JSON.stringify({data:S,updated_at:new Date().toISOString()})});
        if(!r.ok) throw new Error();
        setSync('ok','자동 저장 중');
      }else if(window.storage){ await window.storage.set(KEY,v); }
    }catch(e){ setSync('err','저장 실패 — 이 기기에만 보관됨'); }
    saveTimer=null;
  },700);
}
let pulling=false;
async function pull(){
  if(!cloudOn()||!CODE||pulling||saveTimer)return;
  pulling=true;
  try{
    const r=await api('/rest/v1/trips?code=eq.'+encodeURIComponent(CODE)+'&select=data');
    const rows=await r.json();
    if(rows[0]&&rows[0].data&&JSON.stringify(rows[0].data)!==JSON.stringify(S)){
      if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
      S={...S,...rows[0].data};
      renderPlan();renderFood();renderShop();renderBudget();renderDocs();
      $('#tripTitle').value=S.title||'';
      setSync('ok','업데이트됨');setTimeout(()=>setSync('ok','자동 저장 중'),2000);
    }
  }catch(e){}finally{pulling=false;}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});
setInterval(pull,20000);

/* 이미지 리사이즈 → base64 */
function pickImage(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const MAX=680;let w=img.width,h=img.height;
      if(w>MAX){h=h*MAX/w;w=MAX;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.68));
    };
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}

function drawMap(){
  if(!gmapReady)return;
  gmapObjs.forEach(o=>{ o.map=null; if(o.setMap)o.setMap(null); });
  gmapObjs=[];
  S.days.forEach((d,di)=>{
    const c=DAY_COLORS[di%DAY_COLORS.length];
    const isCur=di===curDay;
    const pts=d.stops.filter(s=>s.lat!=null).map(s=>({lat:+s.lat,lng:+s.lng}));
    if(pts.length>1){
      const line=new GM.Polyline({path:pts,map,strokeOpacity:0,
        icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:isCur?0.9:0.25,strokeWeight:isCur?4:2.5,strokeColor:c,scale:2},offset:'0',repeat:'14px'}]});
      gmapObjs.push(line);
    }
    d.stops.forEach((s,si)=>{
      if(s.lat==null)return;
      const m=new GM.AdvancedMarkerElement({
        position:{lat:+s.lat,lng:+s.lng}, map,
        content:pinEl(si+1,c,!isCur), zIndex:isCur?100:1, title:s.name
      });
      m.addListener('click',()=>{
        infoWin.setContent('<div style="font-family:inherit;padding:2px 4px"><b style="font-size:14px">'+esc(s.name)+'</b>'+
          (s.time?'<br><span style="color:#3182F6;font-weight:700;font-size:12px">'+esc(s.time)+'</span>':'')+
          (s.memo?'<br><span style="font-size:12px;color:#6B7684">'+esc(s.memo)+'</span>':'')+'</div>');
        infoWin.open({map,anchor:m});
      });
      gmapObjs.push(m);
    });
  });
}
function fitMap(){
  if(!gmapReady)return;
  const pts=S.days[curDay].stops.filter(s=>s.lat!=null);
  if(!pts.length)return;
  if(pts.length===1){map.setCenter({lat:+pts[0].lat,lng:+pts[0].lng});map.setZoom(14);return;}
  const b=new GM.LatLngBounds();
  pts.forEach(s=>b.extend({lat:+s.lat,lng:+s.lng}));
  map.fitBounds(b,{top:46,bottom:46,left:46,right:46});
}
/* Places 자동완성 (2025년 신규 방식: PlaceAutocompleteElement)
   ※ 콘솔에서 "Places API (New)"가 활성화돼 있어야 해요 */
let acEl=null;
async function mountAC(boxId,cb){
  const box=document.getElementById(boxId);
  if(!box)return;
  const go=async()=>{
    try{
      const {PlaceAutocompleteElement}=await google.maps.importLibrary('places');
      const el=new PlaceAutocompleteElement({});
      el.style.width='100%';
      el.setAttribute('placeholder','장소 이름으로 검색');
      box.innerHTML='';box.appendChild(el);acEl=el;
      const onPick=async(ev)=>{
        try{
          const pred=ev.placePrediction||(ev.detail&&ev.detail.placePrediction);
          if(!pred)return;
          const place=pred.toPlace();
          await place.fetchFields({fields:['displayName','formattedAddress','location','id']});
          const loc=place.location;
          cb({name:place.displayName||'',
              addr:place.formattedAddress||'',
              lat:typeof loc.lat==='function'?loc.lat():loc.lat,
              lng:typeof loc.lng==='function'?loc.lng():loc.lng,
              gmap:place.id?('https://www.google.com/maps/place/?q=place_id:'+place.id):''});
        }catch(e){ toast('장소 정보를 가져오지 못했어요'); }
      };
      el.addEventListener('gmp-select',onPick);
      el.addEventListener('gmp-placeselect',onPick);
    }catch(e){
      box.innerHTML='<div style="font-size:12.5px;color:#F04452;font-weight:600;padding:2px 4px">검색을 불러오지 못했어요 — Places API (New) 활성화를 확인해 주세요</div>';
    }
  };
  if(gmapReady)go();else acQueue.push(go);
}

const WD=['일','월','화','수','목','금','토'];
function dayDate(i){
  if(!S.startDate)return null;
  const d=new Date(S.startDate+'T00:00:00');
  if(isNaN(d))return null;
  d.setDate(d.getDate()+i);return d;
}
function dayDateLabel(i,long){
  const d=dayDate(i);if(!d)return '';
  return (d.getMonth()+1)+'/'+d.getDate()+(long?' ':'')+' ('+WD[d.getDay()]+')';
}
function tripRangeLabel(){
  if(!S.startDate)return '여행 날짜';
  const a=dayDate(0), b=dayDate(S.days.length-1);
  return (a.getMonth()+1)+'/'+a.getDate()+' – '+(b.getMonth()+1)+'/'+b.getDate()+' · '+S.days.length+'일';
}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

$('#dateBtn').onclick=()=>{
  const endD=S.startDate?iso(dayDate(S.days.length-1)):'';
  openSheet('여행 날짜',
    '<div class="field"><span class="lab">출발</span><input type="date" id="d-start" value="'+(S.startDate||'')+'"></div>'+
    '<div class="field"><span class="lab">도착</span><input type="date" id="d-end" value="'+endD+'"></div>'+
    '<div id="d-info" style="font-size:12.5px;font-weight:600;color:#8B95A1;padding:0 4px 14px"></div>'+
    '<button class="btn btn-blue" id="d-save">저장하기</button>'+
    (S.startDate?'<button class="btn btn-grey" id="d-clear" style="margin-top:8px">날짜 없이 쓰기</button>':''));
  const a=$('#d-start'), b=$('#d-end'), info=$('#d-info');
  const calc=()=>{
    if(!a.value||!b.value){info.textContent='출발일과 도착일을 골라주세요';return 0;}
    const n=Math.round((new Date(b.value)-new Date(a.value))/86400000)+1;
    if(n<1){info.textContent='도착일이 출발일보다 빨라요';info.style.color='#F04452';return 0;}
    info.style.color='#8B95A1';
    const diff=n-S.days.length;
    info.textContent=n+'일 일정'+(diff>0?' · '+diff+'일이 추가돼요':diff<0?' · 마지막 '+(-diff)+'일의 장소는 마지막 날로 옮겨져요':'');
    return n;
  };
  a.onchange=b.onchange=calc; calc();
  $('#d-save').onclick=()=>{
    const n=calc(); if(!n)return;
    S.startDate=a.value;
    while(S.days.length<n) S.days.push({stops:[]});
    if(S.days.length>n){
      const cut=S.days.splice(n);
      const moved=cut.reduce((acc,d)=>acc.concat(d.stops),[]);
      if(moved.length) S.days[n-1].stops=S.days[n-1].stops.concat(moved);
    }
    if(curDay>=S.days.length)curDay=S.days.length-1;
    save();closeSheet();renderPlan();fitMap();toast('여행 날짜를 저장했어요');
  };

/* 구글맵 링크에서 좌표/이름 추출 */
function parseGmap(u){
  if(!u) return null;
  let m=u.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);   // 장소 정확 좌표
  if(m) return {lat:+m[1],lng:+m[2]};
  m=u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);            // 지도 중심 좌표
  if(m) return {lat:+m[1],lng:+m[2]};
  m=u.match(/[?&](?:q|query|ll|center)=(-?\d+\.?\d*)(?:,|%2C)(-?\d+\.?\d*)/);
  if(m) return {lat:+m[1],lng:+m[2]};
  return null;
}
function nameFromGmap(u){
  const m=(u||'').match(/\/place\/([^/@?]+)/);
  if(!m) return '';
  try{return decodeURIComponent(m[1]).replace(/\+/g,' ');}catch(e){return '';}
}
function openGmapSearch(q){
  window.open('https://www.google.com/maps/search/'+encodeURIComponent(q||''),'_blank');
}

/* 공용: 카테고리 선택 UI (＋ 버튼으로 직접 추가) */
function buildCatPick(box, getCats, selected, onSelect, onAddSave){
  const draw=()=>{
    box.innerHTML='';
    getCats().forEach(c=>{
      const b=document.createElement('button');
      b.textContent=(catIconFor(box,c)?catIconFor(box,c)+' ':'')+c;
      if(c===selected)b.classList.add('on');
      b.onclick=()=>{selected=c;onSelect(c);draw();};
      box.appendChild(b);
    });
    const plus=document.createElement('button');
    plus.textContent='＋ 추가';plus.style.color='#3182F6';plus.style.background='#E8F3FF';
    plus.onclick=()=>{
      box.innerHTML='';
      const row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;width:100%';
      row.innerHTML=`<div class="field" style="flex:1;margin-bottom:0"><input id="newcat" placeholder="새 카테고리 이름" maxlength="12"></div>
        <button class="btn btn-blue" style="width:auto;padding:0 18px" id="newcatOk">추가</button>`;
      box.appendChild(row);
      const inp=row.querySelector('#newcat');inp.focus();
      const commit=()=>{
        const v=inp.value.trim();
        if(!v){draw();return;}
        if(getCats().includes(v)){toast('이미 있는 카테고리예요');return;}
        onAddSave(v);selected=v;onSelect(v);save();draw();
      };
      row.querySelector('#newcatOk').onclick=commit;
      inp.onkeydown=e=>{if(e.key==='Enter')commit();};
    };
    box.appendChild(plus);
  };
  draw();
}
function catIconFor(box,c){return box.dataset.kind==='budget'?catIcon(c):'';}
