<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>트립로그</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#3182F6; --blue-dark:#1B64DA; --blue-bg:#E8F3FF;
  --red:#F04452; --green:#00C473; --orange:#FF9F0A;
  --g900:#191F28; --g700:#333D4B; --g600:#4E5968; --g500:#6B7684;
  --g400:#8B95A1; --g300:#B0B8C1; --g200:#D1D6DB; --g100:#E5E8EB;
  --g50:#F2F4F6; --g25:#F9FAFB; --white:#FFFFFF;
  --r-lg:20px; --r-md:16px; --r-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--g50); color:var(--g900);
  max-width:520px; margin:0 auto; position:relative;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;letter-spacing:inherit}
input,textarea,select{font-family:inherit;letter-spacing:inherit;border:none;outline:none;background:none;color:var(--g900)}
input::placeholder,textarea::placeholder{color:var(--g300)}
a{color:var(--blue);text-decoration:none}

/* ---------- layout ---------- */
.page{display:none;padding:0 16px 96px;min-height:100vh}
.page.on{display:block}
.topbar{padding:14px 0 5px}
.topbar h1{font-size:21px;font-weight:800;letter-spacing:-0.02em}
.topbar .sub{font-size:12px;color:var(--g400);margin-top:3px;font-weight:500}
.title-edit{font-size:21px;font-weight:800;width:100%;letter-spacing:-0.02em}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--g100);display:flex;z-index:1000;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--g300);font-size:10px;font-weight:600;transition:color .15s}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--g900)}

/* ---------- cards & common ---------- */
.card{background:var(--white);border-radius:var(--r-md);padding:15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(2,32,71,.04)}
.section-t{font-size:14px;font-weight:700;color:var(--g700);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.section-t .cnt{color:var(--blue);margin-left:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:var(--r-sm);font-size:15px;font-weight:700;transition:transform .1s, filter .15s}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:active{background:var(--blue-dark)}
.btn-grey{background:var(--g50);color:var(--g600)}
.btn-ghost{background:var(--blue-bg);color:var(--blue)}
.chip-add{background:var(--g50);color:var(--g500);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px}
.empty{padding:44px 20px;text-align:center;color:var(--g400);font-size:14px;font-weight:500;line-height:1.6}
.empty .emo{font-size:34px;display:block;margin-bottom:10px}
.field{background:var(--g50);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.field input,.field textarea{flex:1;font-size:15px;font-weight:500;background:none;min-width:0}
.field textarea{resize:none;line-height:1.5}
.field .lab{font-size:13px;font-weight:600;color:var(--g400);flex-shrink:0;min-width:44px}
.row-del{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--g300);flex-shrink:0}
.row-del:active{background:var(--g50);color:var(--red)}
.thumb{width:100%;border-radius:var(--r-sm);margin-top:10px;display:block;max-height:220px;object-fit:cover}
.linkline{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--blue);margin-top:8px;background:var(--blue-bg);padding:6px 11px;border-radius:999px;max-width:100%}
.linkline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.linkline.gmap{background:#E7F8F0;color:#00A661}
.memoline{font-size:13.5px;color:var(--g500);line-height:1.55;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--g200);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff}
.check.on{background:var(--blue);border-color:var(--blue)}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .15s}
.check.on svg{opacity:1;transform:scale(1)}
.done .it-name{text-decoration:line-through;color:var(--g300)}

/* ---------- itinerary ---------- */
#shopMap{height:32vh;min-height:210px;max-height:330px;border-radius:var(--r-md);margin:12px 0;z-index:1;box-shadow:0 1px 3px rgba(2,32,71,.06);background:#fff}
#shopMap .map-off{height:100%}
#map{height:38vh;min-height:240px;max-height:380px;border-radius:var(--r-md);margin-bottom:12px;z-index:1;box-shadow:0 1px 3px rgba(2,32,71,.06)}
.daychips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex-shrink:0;padding:7px 13px;border-radius:14px;background:var(--white);color:var(--g500);font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(2,32,71,.05);transition:all .15s;line-height:1.25;text-align:center}
.dchip .dd{display:block;font-size:10.5px;font-weight:600;opacity:.62;margin-top:3px}
.day-head .dsub{display:inline-block;font-size:13px;font-weight:600;color:var(--g400);margin-left:9px}
.moveday{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.moveday button{padding:8px 13px;border-radius:999px;background:var(--g50);font-size:13.5px;font-weight:700;color:var(--g500);line-height:1.3}
.moveday button.on{background:var(--g900);color:#fff}
.moveday button .dd{display:block;font-size:10px;font-weight:600;opacity:.6;margin-top:2px}
.dchip.on{background:var(--g900);color:#fff}
.dchip.plus{color:var(--blue);background:var(--blue-bg);box-shadow:none}
.stop{display:flex;gap:12px;position:relative}
.stop-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.stop-dot{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop-line{width:2px;flex:1;background:var(--g100);margin:4px 0;border-radius:2px}
.stop:last-child .stop-line{display:none}
.stop-body{flex:1;padding-bottom:18px;min-width:0}
.stop:last-child .stop-body{padding-bottom:4px}
.stop-time{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:2px}
.stop-name{font-size:16px;font-weight:700;word-break:break-word}
.stop-addr{font-size:12px;color:var(--g400);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-acts{display:flex;gap:2px;flex-shrink:0}
.mini{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--g300)}
.mini:active{background:var(--g50);color:var(--g600)}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.day-head b{font-size:17px;font-weight:800}
.day-del{font-size:12.5px;font-weight:600;color:var(--g400)}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--g100);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:700;color:var(--g400);transition:all .15s}
.seg button.on{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(2,32,71,.08)}

/* ---------- budget ---------- */
.bud-hero{background:linear-gradient(135deg,#2B5CE0 0%,#1B3FA8 55%,#122A6E 100%);
  border-radius:var(--r-md);padding:20px 18px;color:#fff;margin-bottom:10px;
  box-shadow:0 6px 20px rgba(18,42,110,.30)}
.bud-hero .cap{font-size:13px;font-weight:600;color:rgba(255,255,255,.72)}
.bud-hero .amt{font-size:26px;font-weight:800;margin-top:3px;letter-spacing:-0.02em}
.bud-hero .amt.over{color:#FFC2C8}
.bud-bar{height:8px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:18px;overflow:hidden}
.bud-fill{height:100%;background:#fff;border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bud-fill.over{background:#FF8B95}
.bud-meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);margin-top:9px}
.exp-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--g50)}
.exp-row:last-child{border-bottom:none}
.exp-ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--g50)}
.exp-name{font-size:15px;font-weight:600;flex:1;min-width:0}
.exp-cat{font-size:12px;color:var(--g400);font-weight:500;margin-top:1px}
.exp-amt{font-size:15.5px;font-weight:700;flex-shrink:0}
.catpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.catpick button{padding:7px 11px;border-radius:999px;background:var(--g50);font-size:13px;font-weight:600;color:var(--g500)}
.catpick button.on{background:var(--g900);color:#fff}

/* ---------- docs ---------- */
.doc-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.stop-body{cursor:pointer}
#foodList .card,#shopPlaceList .card{cursor:pointer}
#foodList .card:active,#shopPlaceList .card:active{background:var(--g25)}
.mapwrap{position:relative;margin-bottom:10px}
.mapwrap #map{margin-bottom:0}
.recenter{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--g700);font-size:12.5px;font-weight:700;
  padding:8px 13px;border-radius:999px;box-shadow:0 2px 8px rgba(2,32,71,.18)}
.recenter:active{background:var(--g50)}
.mapwrap #foodMap,.mapwrap #shopMap{margin-bottom:0}
.doc-tabs.float{position:absolute;top:8px;left:8px;right:8px;padding:0;z-index:2;-webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(to right,#000 88%,transparent);-webkit-mask-image:linear-gradient(to right,#000 88%,transparent)}
.doc-tabs.float .dchip{padding:6px 11px;font-size:12px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 4px rgba(2,32,71,.14)}
.doc-tabs.float .dchip.on{color:#fff}
.doc-tabs::-webkit-scrollbar{display:none}

/* ---------- bottom sheet ---------- */
.dim{position:fixed;inset:0;background:rgba(25,31,40,.5);z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:520px;
  background:#fff;border-radius:24px 24px 0 0;z-index:2001;transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sheet-hd{padding:16px 18px 6px;flex-shrink:0}
.sheet-grip{width:38px;height:4px;background:var(--g200);border-radius:99px;margin:0 auto 16px}
.sheet-hd h2{font-size:17.5px;font-weight:800}
.sheet-bd{padding:10px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.sr{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--g50);width:100%;text-align:left}
.sr:active{background:var(--g25)}
.sr .pin{width:36px;height:36px;border-radius:12px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr b{font-size:15px;font-weight:700;display:block}
.sr small{font-size:12px;color:var(--g400);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.imgpick{border:1.5px dashed var(--g200);border-radius:var(--r-sm);padding:16px;text-align:center;color:var(--g400);font-size:14px;font-weight:600;width:100%;margin-bottom:10px}
.imgpick img{max-height:130px;border-radius:8px;display:block;margin:0 auto}
.searching{padding:26px;text-align:center;color:var(--g400);font-size:14px;font-weight:500}

/* google maps */
#map .map-off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:var(--r-lg);color:var(--g400);font-size:13.5px;font-weight:600;text-align:center;line-height:1.6;padding:20px}
#map .map-off .emo{font-size:32px}
.gm-style{font-family:inherit!important}
#foodMap{height:34vh;min-height:220px;max-height:340px;border-radius:var(--r-md);margin-bottom:10px;background:#fff;box-shadow:0 1px 3px rgba(2,32,71,.06)}
#foodMap .map-off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--g400);font-size:13px;font-weight:600;text-align:center;padding:16px}
.linkchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--g50);color:var(--g600);margin-top:6px}
#shopMap{height:34vh;min-height:220px;max-height:340px;border-radius:var(--r-md);margin-bottom:10px;background:#fff;box-shadow:0 1px 3px rgba(2,32,71,.06)}
#shopMap .map-off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--g400);font-size:13px;font-weight:600;text-align:center;padding:16px}
.tagpin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(2,32,71,.35);font-size:15px;cursor:pointer}
.shop-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:3px}
.acbox{margin-bottom:10px}
.acbox .sr{border-bottom:1px solid var(--g50)}
.acbox .searching{padding:16px;font-size:13px;line-height:1.6}
.pac-container{z-index:3005!important;border-radius:14px;border:none;box-shadow:0 8px 24px rgba(2,32,71,.16);margin-top:6px;font-family:inherit;padding:4px}
.pac-item{border:none;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--g500);cursor:pointer}
.pac-item:hover,.pac-item-selected{background:var(--g50)}
.pac-item-query{font-size:15px;font-weight:700;color:var(--g900)}
.pac-icon{display:none}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--g900);color:#fff;
  padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:3000;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mem-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--g50)}
.mem-row:last-child{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.mem-name{flex:1;font-size:15px;font-weight:600;min-width:0}
.mem-amt{font-size:14.5px;font-weight:700;color:var(--g600)}
.payer-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.payer-pick button{padding:8px 13px;border-radius:999px;background:var(--g50);font-size:13.5px;font-weight:600;color:var(--g500)}
.payer-pick button.on{background:var(--g900);color:#fff}
.share-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.share-pick button{padding:8px 13px;border-radius:999px;background:var(--g50);font-size:13.5px;font-weight:600;color:var(--g400);display:flex;align-items:center;gap:5px}
.share-pick button.on{background:var(--blue-bg);color:var(--blue)}
.sflag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:5px;display:inline-block}
.sflag.todo{background:#FFF4E5;color:#E8890C}
.sflag.done{background:#E7F8F0;color:#00A661}
.exp-row.exp-settled .exp-name,.exp-row.exp-settled .exp-amt{color:var(--g400)}
.exp-row.exp-settled .exp-ic{opacity:.55}
.sbadge{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;flex-shrink:0}
.sbadge.ok{background:#E7F8F0;color:#00A661}
.sbadge.todo{background:#FFF4E5;color:#E8890C}
.sbadge.wait{background:var(--g50);color:var(--g400)}
.sbnote{font-size:12.5px;color:var(--g400);font-weight:500}
.settle-row.settled{opacity:.5}
.settle-row.settled .amt{color:var(--g400);text-decoration:line-through}
.settle-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--g50);font-size:14.5px;font-weight:600}
.settle-row:last-child{border-bottom:none}
.settle-row .arw{color:var(--g300);flex-shrink:0}
.settle-row .amt{margin-left:auto;font-weight:800;color:var(--blue)}
.settle-row.settled{opacity:.5}
.settle-row.settled .amt{color:var(--g400);text-decoration:line-through}
.settle-row .check{width:22px;height:22px;border-radius:7px}
.settle-row .check svg{width:12px;height:12px}
.exp-row .mini{width:28px;height:28px}
.settle-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;margin-bottom:10px}
.settle-badge.ok{background:#E7F8F0;color:#00A661}
.settle-badge.wait{background:#FFF4E5;color:#C77700}
.exp-who{font-size:11.5px;color:var(--g400);font-weight:500;margin-top:2px}
.gate{position:fixed;inset:0;background:var(--g50);z-index:2500;display:none;overflow-y:auto;padding:0 20px}
.gate.on{display:block}
.gate-in{max-width:480px;margin:0 auto;padding:48px 0 36px}
.gate-logo{font-size:44px;margin-bottom:10px}
.gate-t{font-size:26px;font-weight:800;letter-spacing:-0.02em}
.gate-s{font-size:14px;color:var(--g400);font-weight:500;margin:6px 0 24px}
.gate-err{font-size:13px;font-weight:600;color:var(--red);padding:0 4px 12px;min-height:18px;line-height:1.5}
.trip-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r-md);padding:16px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 1px 2px rgba(2,32,71,.04)}
.trip-row:active{background:var(--g25)}
.trip-row .ic{width:42px;height:42px;border-radius:13px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.trip-row b{font-size:16px;font-weight:700;display:block}
.trip-row small{font-size:12px;color:var(--g400);display:block;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--g50);color:var(--g400)}
.sync.ok{background:#E7F8F0;color:#00A661}
.sync.saving{background:var(--blue-bg);color:var(--blue)}
.sync.err{background:#FEECEE;color:var(--red)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sharebtn{font-size:12px;font-weight:700;color:var(--blue);background:var(--blue-bg);padding:4px 10px;border-radius:999px}
/* 작은 화면에서 한 단계 더 축소 */
@media (max-width:390px){
  .page{padding:0 13px 92px}
  .card{padding:13px}
  .topbar h1,.title-edit{font-size:20px}
  .bud-hero .amt{font-size:24px}
  .bud-hero{padding:18px 16px}
  .field{padding:10px 12px}
  .field input,.field textarea{font-size:14.5px}
  .btn{padding:12px;font-size:14.5px}
  #map{height:34vh;min-height:220px}
  .stop-name{font-size:15px}
  .dchip{padding:7px 13px;font-size:13px}
  .nav button{font-size:9.5px}
  .nav button svg{width:20px;height:20px}
}

<script>
/* ================= state & storage ================= */
const DAY_COLORS=['#3182F6','#F04452','#00C473','#FF9F0A','#7048E8','#0BB8CC','#F35CA6','#8B95A1'];
const KEY='tripmate-v1';
let S={
  title:'',
  days:[{stops:[]}],          // stops: {name, addr, lat, lng, time, memo}
  food:[],                    // {name, memo, link, img, done}
  shopItems:[],               // {name, price, memo, link, img, done}
  shopPlaces:[],              // {name, memo, link}
  budget:{total:0, expenses:[], settlements:[]}, // expenses:{name,amount,cat,payer,shares} / settlements:{from,to,amt}
  docs:[],                    // {cat, title, memo, link, img}
  cats:{budget:[], docs:[], food:[], shop:[]},  // 사용자 추가 카테고리
  members:[],                 // 함께 가는 사람 [{id,name}]
  region:'jp'                 // 검색 우선 지역
};
let curDay=0, curDocCat='전체', curShopSeg='items', curExpWho='all';
let memOnly=false;

/* ===== Supabase 설정 =====
   1) supabase.com 프로젝트 생성 → SQL Editor에 아래 전체 실행:

create extension if not exists pgcrypto;

create table trips (
  code text primary key,
  data jsonb default '{}'::jsonb,
  owner_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  join_secret text not null default encode(gen_random_bytes(8),'hex'),
  updated_at timestamptz default now()
);
create table trip_members (
  code text not null references trips(code) on delete cascade,
  user_id uuid not null references auth.users(id) on delete cascade,
  primary key (code, user_id)
);
alter table trips enable row level security;
alter table trip_members enable row level security;

create or replace function is_member(t text) returns boolean
language sql security definer stable as $$
  select exists(select 1 from trip_members m where m.code=t and m.user_id=auth.uid());
$$;

create policy "trip read"   on trips for select using (owner_id=auth.uid() or is_member(code));
create policy "trip insert" on trips for insert with check (owner_id=auth.uid());
create policy "trip update" on trips for update using (owner_id=auth.uid() or is_member(code));
create policy "trip delete" on trips for delete using (owner_id=auth.uid());
create policy "mem read"    on trip_members for select using (user_id=auth.uid());
create policy "mem leave"   on trip_members for delete using (user_id=auth.uid());

create or replace function join_trip(p_code text, p_secret text) returns boolean
language plpgsql security definer as $$
begin
  if not exists(select 1 from trips where code=p_code and join_secret=p_secret) then
    return false;
  end if;
  insert into trip_members(code,user_id) values(p_code,auth.uid()) on conflict do nothing;
  return true;
end; $$;

   2) Authentication → Sign In / Providers → Email 에서
      "Confirm email" 끄기 (아이디 로그인이라 인증메일이 필요 없어요)
   3) Settings → API 에서 아래 두 값 붙여넣기                       */
const SUPABASE_URL = 'https://hmodjglzhubvvqlygdfl.supabase.co';      // 예: https://abcd.supabase.co
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhtb2RqZ2x6aHVidnZxbHlnZGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTA3MDksImV4cCI6MjEwMjYyNjcwOX0.9-bmgGi5ECizgIgRmujCudjkXh4_mA5zEslvisnd_EE';

const cloudOn = ()=>SUPABASE_URL.startsWith('http') && SUPABASE_KEY.length>20;
/* 아이디 → 내부 이메일, 짧은 비번은 자동 패딩 (4자리도 가능) */
const ID_DOMAIN='@example.com', PW_PAD='::tripmate-9f2a';  // .local 등 예약 TLD는 Supabase가 거부해요
const toEmail=id=>id.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+ID_DOMAIN;
const toPw=pw=>pw+PW_PAD;
const fromEmail=e=>(e||'').split('@')[0];

let session=null, CODE=null, myName='';
const SKEY='tripmate-session';
function saveSession(x){session=x;try{localStorage.setItem(SKEY,JSON.stringify(x));}catch(e){}}
function clearSession(){session=null;try{localStorage.removeItem(SKEY);}catch(e){}}
function loadSession(){try{session=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){session=null;}}

function hdrs(){
  return {'apikey':SUPABASE_KEY,'Content-Type':'application/json',
    'Authorization':'Bearer '+(session&&session.access_token?session.access_token:SUPABASE_KEY)};
}
async function api(path,opts){
  opts=opts||{};
  let r=await fetch(SUPABASE_URL+path,{...opts,headers:{...hdrs(),...(opts.headers||{})}});
  if(r.status===401&&session&&session.refresh_token){
    if(await doRefresh()) r=await fetch(SUPABASE_URL+path,{...opts,headers:{...hdrs(),...(opts.headers||{})}});
  }
  return r;
}
async function doRefresh(){
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok){clearSession();return false;}
    const j=await r.json();saveSession(j);return true;
  }catch(e){return false;}
}
async function authRequest(kind,id,pw){
  const path=kind==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
  const r=await fetch(SUPABASE_URL+path,{
    method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:toEmail(id),password:toPw(pw)})});
  const j=await r.json();
  if(!r.ok||j.error){
    const m=(j.error_description||j.msg||j.message||'').toLowerCase();
    if(m.includes('invalid login')) throw new Error('아이디 또는 비밀번호가 맞지 않아요');
    if(m.includes('already registered')||m.includes('already been')) throw new Error('이미 있는 아이디예요. 로그인해 주세요');
    if(m.includes('confirm')) throw new Error('Supabase에서 "Confirm email"을 꺼주세요');
    throw new Error(j.msg||j.error_description||'요청에 실패했어요');
  }
  if(!j.access_token) throw new Error('가입은 됐지만 자동 로그인에 실패했어요. 로그인해 주세요');
  saveSession(j);
  myName=id.trim().toLowerCase();
  return j;
}

/* ---------- 게이트 화면 ---------- */
const showGate=g=>{document.querySelectorAll('.gate').forEach(x=>x.classList.remove('on'));if(g)$(g).classList.add('on');};
let authMode='login';
function initAuthUI(){
  const err=$('#au-err'), go=$('#au-go'), swap=$('#au-swap');
  swap.onclick=()=>{
    authMode=authMode==='login'?'signup':'login';
    go.textContent=authMode==='login'?'로그인':'가입하고 시작하기';
    swap.textContent=authMode==='login'?'처음이신가요? 회원가입':'이미 계정이 있어요';
    $('#authSub').textContent=authMode==='login'?'아이디와 비밀번호로 시작하세요':'쓰고 싶은 아이디와 비밀번호를 정하세요';
    err.textContent='';
  };
  go.onclick=async()=>{
    const id=$('#au-id').value.trim(), pw=$('#au-pw').value;
    if(!id){err.textContent='아이디를 입력해 주세요';return;}
    if(pw.length<4){err.textContent='비밀번호는 4자리 이상 입력해 주세요';return;}
    err.textContent='';go.textContent='잠시만요…';go.disabled=true;
    try{ await authRequest(authMode,id,pw); await afterLogin(); }
    catch(e){ err.textContent=e.message; }
    go.disabled=false;go.textContent=authMode==='login'?'로그인':'가입하고 시작하기';
  };
  $('#au-pw').onkeydown=e=>{if(e.key==='Enter')go.click();};
  $('#tg-out').onclick=()=>{
    try{ localStorage.removeItem(lastKey()); }catch(e){}
    /* 예전 버전에서 남은 공용 키도 정리해요 */
    try{ localStorage.removeItem('tripmate-lasttrip'); }catch(e){}
    clearSession();
    location.href=location.pathname;
  };
  $('#tg-new').onclick=()=>createTrip();
}

/* 마지막에 본 여행은 계정별로 따로 기억해요 (다른 계정으로 로그인하면 섞이지 않게) */
function lastKey(){ return 'tripmate-lasttrip:'+(session&&session.user&&session.user.id?session.user.id:'anon'); }
async function afterLogin(){
  const u=new URL(location.href);
  let code=u.searchParams.get('trip');
  const k=u.searchParams.get('k');
  if(code&&k){ try{ await api('/rest/v1/rpc/join_trip',{method:'POST',body:JSON.stringify({p_code:code,p_secret:k})}); }catch(e){} }
  /* 주소에 여행이 없으면 마지막에 보던 여행으로 복귀 */
  if(!code){ try{ code=localStorage.getItem(lastKey())||''; }catch(e){} if(code) setUrlCode(code); }
  if(code){ CODE=code; return openTrip(); }
  return showTripList();
}
function setUrlCode(c){
  const u=new URL(location.href);u.searchParams.set('trip',c);u.searchParams.delete('k');
  history.replaceState(null,'',u);
}
async function showTripList(){
  showGate('#tripGate');
  const nm=(myName||'').split('@')[0];
  $('#tg-who').textContent=nm?nm+'님, 어디로 떠나볼까요?':'어디로 떠나볼까요?';
  const w=$('#tg-list');w.innerHTML='<div class="empty">불러오는 중…</div>';
  try{
    const r=await api('/rest/v1/trips?select=code,data,updated_at&order=updated_at.desc');
    const rows=await r.json();
    if(!rows.length){w.innerHTML='<div class="empty"><span class="emo">✈️</span>아직 여행이 없어요<br>아래에서 첫 여행을 만들어 보세요</div>';return;}
    w.innerHTML='';
    rows.forEach(t=>{
      const title=(t.data&&t.data.title)||'이름 없는 여행';
      const n=(t.data&&t.data.days)?t.data.days.length:0;
      const row=document.createElement('div');row.className='trip-row';
      row.innerHTML='<span class="ic">🧳</span><span style="min-width:0;flex:1"><b>'+esc(title)+'</b><small>'+n+'일 일정 · '+esc(t.code)+'</small></span>'+
        '<button class="row-del" data-a="del">'+ICON_TRASH+'</button>';
      row.onclick=e=>{ if(e.target.closest('[data-a=del]'))return; CODE=t.code;setUrl();openTrip(); };
      row.querySelector('[data-a=del]').onclick=()=>confirmDelete(t.code,title);
      w.appendChild(row);
    });
  }catch(e){w.innerHTML='<div class="empty">불러오지 못했어요</div>';}
}
function confirmDelete(code,title){
  openSheet('여행 삭제',
    '<div style="font-size:14px;color:#4E5968;line-height:1.7;padding:0 4px 16px"><b style="color:#191F28">'+esc(title)+'</b> 을(를) 삭제할까요?<br>일정·맛집·쇼핑·예산·정보가 모두 사라지고 되돌릴 수 없어요.<br><span style="color:#B0B8C1;font-size:12.5px">함께 보던 사람들도 볼 수 없게 돼요</span></div>'+
    '<button class="btn" id="dl-yes" style="background:var(--red);color:#fff">삭제하기</button>'+
    '<button class="btn btn-grey" style="margin-top:8px" onclick="closeSheet()">취소</button>');
  $('#dl-yes').onclick=async()=>{
    const btn=$('#dl-yes');btn.disabled=true;btn.textContent='삭제 중…';
    try{
      const r=await api('/rest/v1/trips?code=eq.'+encodeURIComponent(code),
        {method:'DELETE',headers:{'Prefer':'return=representation'}});
      const gone=await r.json();
      if(!r.ok) throw new Error();
      closeSheet();
      if(Array.isArray(gone)&&gone.length===0){ toast('만든 사람만 삭제할 수 있어요'); return; }
      toast('여행을 삭제했어요');
      try{ if(localStorage.getItem(lastKey())===code) localStorage.removeItem(lastKey()); }catch(e){}
      if(CODE===code){CODE=null;history.replaceState(null,'',location.pathname);}
      showTripList();
    }catch(e){ btn.disabled=false;btn.textContent='삭제하기'; toast('삭제하지 못했어요'); }
  };
}
async function createTrip(){
  const btn=$('#tg-new');btn.disabled=true;btn.textContent='만드는 중…';
  try{
    const code=Math.random().toString(36).slice(2,8);
    const r=await api('/rest/v1/trips',{method:'POST',headers:{'Prefer':'return=representation'},
      body:JSON.stringify({code,data:{title:'',days:[{stops:[]}]}})});
    if(!r.ok) throw new Error();
    CODE=code;setUrl();await openTrip();

function pickImage(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const img=new Image();
    img.onload=()=>{
      const MAX=680;let w=img.width,h=img.height;
      if(w>MAX){h=h*MAX/w;w=MAX;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.68));
    };
    img.src=URL.createObjectURL(f);
  };
  inp.click();
}

/* 핀들이 흩어져 있으면 가장 밀집한 구역에 맞춰요 (멀리 떨어진 하나 때문에 지도가 넓어지지 않게) */
function densePoints(pts){
  if(pts.length<3)return pts;
  const lats=pts.map(p=>+p.lat).sort((a,b)=>a-b);
  const lngs=pts.map(p=>+p.lng).sort((a,b)=>a-b);
  const mid=a=>a[Math.floor(a.length/2)];
  const cLat=mid(lats), cLng=mid(lngs);
  const km=(p)=>{
    const dy=(+p.lat-cLat)*111;
    const dx=(+p.lng-cLng)*111*Math.cos(cLat*Math.PI/180);
    return Math.sqrt(dx*dx+dy*dy);
  };
  const near=pts.filter(p=>km(p)<=80);          // 중심에서 80km 이내
  return near.length>=Math.max(2,Math.ceil(pts.length*0.5))?near:pts;
}
function fitPoints(mapObj,pts,zoomOne){
  if(!mapObj||!pts.length)return;
  const use=densePoints(pts);
  if(use.length===1){
    mapObj.setCenter({lat:+use[0].lat,lng:+use[0].lng});
    mapObj.setZoom(zoomOne||15);
    return;
  }
  const b=new GM.LatLngBounds();
  use.forEach(p=>b.extend({lat:+p.lat,lng:+p.lng}));
  mapObj.fitBounds(b,{top:44,bottom:44,left:44,right:44});
}
/* 목록 항목을 누르면 해당 핀으로 지도를 옮기고 말풍선을 열어요 */
function focusPin(mapObj,infoObj,objs,idxOrMatch,scrollTo){
  if(!gmapReady||!mapObj)return;
  const m=typeof idxOrMatch==='function'?objs.find(idxOrMatch):objs[idxOrMatch];
  if(!m||!m.position)return;
  const p=m.position;
  const lat=typeof p.lat==='function'?p.lat():p.lat;
  const lng=typeof p.lng==='function'?p.lng():p.lng;
  mapObj.setCenter({lat:+lat,lng:+lng});
  mapObj.setZoom(16);
  if(m.__openInfo)m.__openInfo();
  if(scrollTo){
    const el=document.getElementById(scrollTo);
    if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function allStops(){
  const out=[];
  S.days.forEach(d=>d.stops.forEach(s=>{ if(s.lat!=null)out.push(s); }));
  return out;
}
function fitMap(){
  if(!gmapReady)return;
  if(curDay>=S.days.length)curDay=Math.max(0,S.days.length-1);
  const day=S.days[curDay]||{stops:[]};
  /* 선택한 날에 장소가 있으면 그 날 기준, 없으면 전체 일정 기준으로 이동 */
  let pts=day.stops.filter(s=>s.lat!=null);
  if(!pts.length)pts=allStops();
  if(!pts.length){
    const ri=regionInfo();
    map.setCenter({lat:ri[2],lng:ri[3]});map.setZoom(ri[4]);
    return;
  }
  fitPoints(map,pts,15);
}

const TAG_COLORS=['#3182F6','#F04452','#00C473','#FF9F0A','#7048E8','#0BB8CC','#F35CA6','#8B5E3C','#E8590C','#4E5968'];

/* 태그 정의(이름·이모지·색)를 편집할 수 있게 저장해요 */
function tagDefs(kind){
  if(!S.tagDefs)S.tagDefs={};
  if(!S.tagDefs[kind]){
    const base=(kind==='shop'?SHOP_TAGS:FOOD_DEFAULTS).map(t=>({label:t[0],color:t[1],emo:t[2]}));
    const custom=((S.cats&&S.cats[kind])||[]).map((c,i)=>({label:'🏷️ '+c,color:TAG_COLORS[i%TAG_COLORS.length],emo:'🏷️'}));
    S.tagDefs[kind]=base.concat(custom);
  }
  return S.tagDefs[kind];
}
function defOf(kind,label){ return tagDefs(kind).find(t=>t.label===label); }
function shopTags(){ return tagDefs('shop').map(t=>t.label); }
function addTag(kind,name){
  const defs=tagDefs(kind);
  const label='🏷️ '+name;
  defs.push({label,color:TAG_COLORS[defs.length%TAG_COLORS.length],emo:'🏷️'});
  return label;
}
function styleOf(kind,label,fb){
  const d=defOf(kind,label);
  if(d)return {color:d.color,emo:d.emo};
  return {color:'#8B95A1',emo:emojiOf(label,fb)};
}
function tagStyle(tag){ return styleOf('shop',tag,'🛍️'); }

}

/* Places 자동완성: 구글 위젯 대신 AutocompleteSuggestion API로 직접 검색·렌더
   (위젯 드롭다운이 바텀시트에 가려지는 문제를 피하고, 오류도 화면에 표시해요) */
async function mountAC(boxId,cb){
  const box=document.getElementById(boxId);
  if(!box)return;
  box.innerHTML=
    '<div class="field" style="margin-bottom:0">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:#8B95A1;flex-shrink:0"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'+
      '<input id="'+boxId+'-q" placeholder="장소 이름으로 검색" autocomplete="off" autocapitalize="off">'+
      '<button id="'+boxId+'-x" style="color:#B0B8C1;font-size:18px;flex-shrink:0;display:none">✕</button>'+
    '</div>'+
    '<div id="'+boxId+'-r"></div>';
  const inp=document.getElementById(boxId+'-q');
  const res=document.getElementById(boxId+'-r');
  const clr=document.getElementById(boxId+'-x');
  let timer=null, token=null;

  const render=(list)=>{
    res.innerHTML='';
    if(!list.length){res.innerHTML='<div class="searching">결과가 없어요. 지점명을 빼거나 영문으로도 검색해 보세요</div>';return;}
    list.forEach(pred=>{
      const main=pred.mainText?pred.mainText.toString():pred.text.toString();
      const sub=pred.secondaryText?pred.secondaryText.toString():'';
      const b=document.createElement('button');b.className='sr';
      b.innerHTML='<span class="pin">'+ICON_MAP+'</span><span style="min-width:0"><b>'+esc(main)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>';
      b.onclick=async()=>{
        res.innerHTML='<div class="searching">불러오는 중…</div>';
        try{
          const place=pred.toPlace();
          await place.fetchFields({fields:['displayName','formattedAddress','location','id']});
          const loc=place.location;
          cb({name:place.displayName||main,
              addr:place.formattedAddress||sub,
              lat:typeof loc.lat==='function'?loc.lat():loc.lat,
              lng:typeof loc.lng==='function'?loc.lng():loc.lng,
              gmap:place.id?('https://www.google.com/maps/place/?q=place_id:'+place.id):''});
          res.innerHTML='';inp.value='';clr.style.display='none';token=null;
        }catch(e){ res.innerHTML='<div class="searching">장소 정보를 가져오지 못했어요: '+esc(e.message||'')+'</div>'; }
      };
      res.appendChild(b);
    });
  };

  const run=async()=>{
    const q=inp.value.trim();
    clr.style.display=q?'':'none';
    if(q.length<2){res.innerHTML='';return;}
    res.innerHTML='<div class="searching">검색 중…</div>';
    try{
      const places=await google.maps.importLibrary('places');
      const {AutocompleteSuggestion,AutocompleteSessionToken}=places;
      if(!AutocompleteSuggestion){
        res.innerHTML='<div class="searching" style="color:#F04452">Places API (New)를 활성화해 주세요</div>';return;
      }
      if(!token)token=new AutocompleteSessionToken();
      const ri=regionInfo();
      const req={input:q, sessionToken:token, language:'ko', region:ri[0],
        includedRegionCodes:[ri[0].toUpperCase()]};
      /* 이미 찍은 핀이 있으면 그 근처를 우선해서 찾아요 */
      const anchor=allStops()[0];
      const c=anchor?{lat:+anchor.lat,lng:+anchor.lng}:{lat:ri[2],lng:ri[3]};
      req.locationBias={center:c,radius:anchor?50000:300000};
      const {suggestions}=await AutocompleteSuggestion.fetchAutocompleteSuggestions(req);
      render((suggestions||[]).map(s=>s.placePrediction).filter(Boolean));
    }catch(e){
      res.innerHTML='<div class="searching" style="color:#F04452">검색 실패: '+esc(e.message||'알 수 없는 오류')+'<br><span style="color:#B0B8C1">Places API (New) 활성화와 키 제한을 확인해 주세요</span></div>';
    }
  };

  inp.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,350);};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);run();}};
  clr.onclick=()=>{inp.value='';res.innerHTML='';clr.style.display='none';inp.focus();};

  if(!gmapReady){
    res.innerHTML='<div class="searching">지도를 준비하는 중이에요…</div>';
    acQueue.push(()=>{res.innerHTML='';});
  }
}

/* ---------- 날짜 ---------- */
const WD=['일','월','화','수','목','금','토'];
function dayDate(i){
  if(!S.startDate)return null;
  const d=new Date(S.startDate+'T00:00:00');
  if(isNaN(d))return null;
  d.setDate(d.getDate()+i);return d;
}
function dayDateLabel(i,long){
  const d=dayDate(i);if(!d)return '';
  return (d.getMonth()+1)+'/'+d.getDate()+(long?' ':'')+' ('+WD[d.getDay()]+')';
}
function tripRangeLabel(){
  if(!S.startDate)return '여행 날짜';
  const a=dayDate(0), b=dayDate(S.days.length-1);
  return (a.getMonth()+1)+'/'+a.getDate()+' – '+(b.getMonth()+1)+'/'+b.getDate()+' · '+S.days.length+'일';
}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

$('#dateBtn').onclick=()=>{
  const endD=S.startDate?iso(dayDate(S.days.length-1)):'';
  openSheet('여행 설정',
    '<div style="font-size:12.5px;font-weight:700;color:var(--g400);padding:2px 4px 8px">여행 지역</div>'+
    '<div class="catpick" id="d-region">'+REGIONS.map(r=>'<button data-r="'+r[0]+'"'+(r[0]===S.region?' class="on"':'')+'>'+r[1]+'</button>').join('')+'</div>'+
    '<div style="font-size:12px;color:#B0B8C1;padding:0 4px 16px">장소 검색이 이 지역을 우선해서 찾아줘요</div>'+
    '<div class="field"><span class="lab">출발</span><input type="date" id="d-start" value="'+(S.startDate||'')+'"></div>'+
    '<div class="field"><span class="lab">도착</span><input type="date" id="d-end" value="'+endD+'"></div>'+
    '<div id="d-info" style="font-size:12.5px;font-weight:600;color:#8B95A1;padding:0 4px 14px"></div>'+
    '<button class="btn btn-blue" id="d-save">저장하기</button>'+
    (S.startDate?'<button class="btn btn-grey" id="d-clear" style="margin-top:8px">날짜 없이 쓰기</button>':''));
  const rbox=$('#d-region');
  rbox.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    rbox.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); S.region=btn.dataset.r; save();
    if(gmapReady&&!S.days.some(d=>d.stops.some(s=>s.lat!=null))){
      const ri=regionInfo(); map.setCenter({lat:ri[2],lng:ri[3]}); map.setZoom(ri[4]);
    }
  });
  const a=$('#d-start'), b=$('#d-end'), info=$('#d-info');
  const calc=()=>{
    if(!a.value||!b.value){info.textContent='출발일과 도착일을 골라주세요';return 0;}
    const n=Math.round((new Date(b.value)-new Date(a.value))/86400000)+1;
    if(n<1){info.textContent='도착일이 출발일보다 빨라요';info.style.color='#F04452';return 0;}
    info.style.color='#8B95A1';
    const diff=n-S.days.length;
    info.textContent=n+'일 일정'+(diff>0?' · '+diff+'일이 추가돼요':diff<0?' · 마지막 '+(-diff)+'일의 장소는 마지막 날로 옮겨져요':'');
    return n;
  };
  a.onchange=b.onchange=calc; calc();
  $('#d-save').onclick=()=>{
    const n=calc();
    if(!n){ save(); closeSheet(); toast('여행 지역을 저장했어요'); return; }
    S.startDate=a.value;
    while(S.days.length<n) S.days.push({stops:[]});
    if(S.days.length>n){
      const cut=S.days.splice(n);
      const moved=cut.reduce((acc,d)=>acc.concat(d.stops),[]);
      if(moved.length) S.days[n-1].stops=S.days[n-1].stops.concat(moved);
    }
    if(curDay>=S.days.length)curDay=S.days.length-1;
    save();closeSheet();renderPlan();fitMap();toast('여행 날짜를 저장했어요');
  };
  if($('#d-clear'))$('#d-clear').onclick=()=>{S.startDate='';save();closeSheet();renderPlan();};
};

/* 구글맵 링크에서 좌표/이름 추출 */
function parseGmap(u){
  if(!u) return null;
  let m=u.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/);   // 장소 정확 좌표
  if(m) return {lat:+m[1],lng:+m[2]};
  m=u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);            // 지도 중심 좌표
  if(m) return {lat:+m[1],lng:+m[2]};
  m=u.match(/[?&](?:q|query|ll|center)=(-?\d+\.?\d*)(?:,|%2C)(-?\d+\.?\d*)/);
  if(m) return {lat:+m[1],lng:+m[2]};
  return null;
}
function nameFromGmap(u){
  const m=(u||'').match(/\/place\/([^/@?]+)/);
  if(!m) return '';
  try{return decodeURIComponent(m[1]).replace(/\+/g,' ');}catch(e){return '';}
}
function openGmapSearch(q){
  window.open('https://www.google.com/maps/search/'+encodeURIComponent(q||''),'_blank');
}

const EMOJI_SET=['👕','👟','👜','🎰','🧸','🎮','💄','🧴','🍫','🍜','🍣','🍰','☕','🍺','📚','💿','🏬','🎁','🛍️','⭐','🏷️','🍝','🍔','🥐','🍦','🐟','🥩','🌸'];
function tagManager(kind,onDone){
  const title=kind==='shop'?'쇼핑 태그 관리':'맛집 종류 관리';

    '<button class="btn btn-grey" id="tm-add" style="margin-top:4px">＋ 새 태그 만들기</button>'+

  const box=$('#tm-list');
  const usedCount=(label)=>kind==='shop'
    ? S.shopPlaces.filter(p=>p.tag===label).length
    : S.food.filter(f=>f.cat===label).length;
  const draw=()=>{
    box.innerHTML='';
    tagDefs(kind).forEach((d,i)=>{
      const row=document.createElement('div');
      row.style.cssText='background:var(--g25);border-radius:12px;padding:11px;margin-bottom:8px';
      const cnt=usedCount(d.label);
      row.innerHTML=
        '<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">'+
          '<span class="tagpin" style="background:'+d.color+';width:32px;height:32px;flex-shrink:0">'+d.emo+'</span>'+
          '<input class="tm-name" value="'+esc(d.name||d.label.replace(d.emo,'').trim())+'" maxlength="10" '+
            'style="flex:1;font-size:14.5px;font-weight:700;background:#fff;border-radius:9px;padding:8px 10px;min-width:0">'+
          '<button class="row-del tm-del">'+ICON_TRASH+'</button>'+
        '</div>'+
        '<div class="tm-emos" style="display:flex;gap:4px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none"></div>'+
        '<div class="tm-cols" style="display:flex;gap:6px;flex-wrap:wrap"></div>'+
        (cnt?'<div style="font-size:11.5px;color:var(--g400);font-weight:600;padding-top:7px">'+cnt+'곳에서 사용 중</div>':'');
      /* 이모지 선택 */
      const eb=row.querySelector('.tm-emos');
      EMOJI_SET.forEach(e=>{
        const b=document.createElement('button');
        b.textContent=e;
        b.style.cssText='flex-shrink:0;width:30px;height:30px;border-radius:9px;font-size:16px;background:'+(e===d.emo?'var(--g900)':'#fff');
        b.onclick=()=>{ renameTag(kind,i,{emo:e}); draw(); };
        eb.appendChild(b);
      });
      /* 색 선택 */
      const cb=row.querySelector('.tm-cols');
      TAG_COLORS.forEach(c=>{
        const b=document.createElement('button');
        b.style.cssText='width:22px;height:22px;border-radius:50%;background:'+c+
          ';border:'+(c===d.color?'3px solid var(--g900)':'2px solid #fff')+';box-shadow:0 1px 3px rgba(2,32,71,.2)';
        b.onclick=()=>{ renameTag(kind,i,{color:c}); draw(); };
        cb.appendChild(b);
      });
      /* 이름 변경 */
      const ni=row.querySelector('.tm-name');
      ni.onchange=()=>{ const v=ni.value.trim(); if(v)renameTag(kind,i,{name:v}); draw(); };
      /* 삭제 */
      row.querySelector('.tm-del').onclick=()=>{
        if(cnt){ toast(cnt+'곳에서 쓰는 중이라 지울 수 없어요'); return; }
        tagDefs(kind).splice(i,1); save(); draw();
      };
      box.appendChild(row);
    });
  };
  draw();
  $('#tm-add').onclick=()=>{
    const defs=tagDefs(kind);
    defs.push({label:'🏷️ 새 태그',name:'새 태그',emo:'🏷️',color:TAG_COLORS[defs.length%TAG_COLORS.length]});
    save();draw();
    box.lastChild.querySelector('.tm-name').focus();
  };
  $('#tm-close').onclick=()=>{
    closeSheet();
    if(kind==='shop'){renderShop();drawShopMap();}else{renderFood();drawFoodMap();}
    if(onDone)onDone();
  };

/* 태그 정의를 바꾸고, 그 태그를 쓰던 항목들의 라벨도 함께 갱신해요 */
function renameTag(kind,idx,patch){
  const defs=tagDefs(kind);
  const d=defs[idx];
  const oldLabel=d.label;
  if(patch.emo!==undefined)d.emo=patch.emo;
  if(patch.color!==undefined)d.color=patch.color;
  if(patch.name!==undefined)d.name=patch.name;
  const nm=d.name||oldLabel.replace(d.emo,'').trim();
  d.name=nm;
  const newLabel=d.emo+' '+nm;
  if(newLabel!==oldLabel){
    if(defs.some((x,i)=>i!==idx&&x.label===newLabel)){ toast('같은 이름의 태그가 있어요'); return; }
    d.label=newLabel;
    if(kind==='shop'){
      S.shopPlaces.forEach(p=>{ if(p.tag===oldLabel)p.tag=newLabel; });
      if(curShopTag===oldLabel)curShopTag=newLabel;
    }else{
      S.food.forEach(f=>{ if(f.cat===oldLabel)f.cat=newLabel; });
      if(curFoodCat===oldLabel)curFoodCat=newLabel;
    }
  }
  save();
}

function buildCatPick(box, getCats, selected, onSelect, onAddSave, tagKind){
  const draw=()=>{
    box.innerHTML='';
    getCats().forEach(c=>{
      const b=document.createElement('button');
      b.textContent=(catIconFor(box,c)?catIconFor(box,c)+' ':'')+c;
      if(c===selected){
        b.classList.add('on');
        if(tagKind){const st=styleOf(tagKind,c);b.style.background=st.color;}
      }
      b.onclick=()=>{selected=c;onSelect(c);draw();};
      box.appendChild(b);
    });
    if(tagKind){
      const mg=document.createElement('button');
      mg.textContent='⚙️ 태그 관리';mg.style.color='var(--g500)';
      mg.onclick=()=>tagManager(tagKind,()=>{draw();});
      box.appendChild(mg);
    }
    const plus=document.createElement('button');
    plus.textContent='＋ 추가';plus.style.color='#3182F6';plus.style.background='#E8F3FF';
    plus.onclick=()=>{
      box.innerHTML='';
      const row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;width:100%';
      row.innerHTML=`<div class="field" style="flex:1;margin-bottom:0"><input id="newcat" placeholder="새 카테고리 이름" maxlength="12"></div>
        <button class="btn btn-blue" style="width:auto;padding:0 18px" id="newcatOk">추가</button>`;
      box.appendChild(row);
      const inp=row.querySelector('#newcat');inp.focus();
      const commit=()=>{
        const v=inp.value.trim();
        if(!v){draw();return;}
        if(getCats().includes(v)||getCats().includes('🏷️ '+v)){toast('이미 있는 이름이에요');return;}
        const r=onAddSave(v);
        selected=tagKind?('🏷️ '+v):v;
        if(typeof r==='string')selected=r;
        onSelect(selected);save();draw();
      };
      row.querySelector('#newcatOk').onclick=commit;
      inp.onkeydown=e=>{if(e.key==='Enter')commit();};
    };
    box.appendChild(plus);
  };
  draw();
}
function catIconFor(box,c){return box.dataset.kind==='budget'?catIcon(c):'';}
function renderBudget(){
  const allSpent=S.budget.expenses.reduce((a,b)=>a+(+b.amount||0),0);
  const spent=S.members.length?sharedTotal():allSpent;   // 사람이 있으면 공동 지출만
  const total=+S.budget.total||0;
  const remain=total-spent;
  $('#budRemain').textContent=won(remain);
  $('#budRemain').classList.toggle('over',remain<0);
  $('#budSpent').textContent=(S.members.length?'공동 지출 ':'쓴 돈 ')+won(spent);
  $('#budTotal').textContent=total?'공동 예산 '+won(total)+' ›':'공동 예산 설정 ›';
  const pct=total?Math.min(100,spent/total*100):0;
  $('#budFill').style.width=pct+'%';
  $('#budFill').classList.toggle('over',remain<0);
  /* 정산 상태 뱃지 */
  const sb=$('#settleBadge');sb.innerHTML='';
  if(S.members.length&&S.budget.expenses.length){
    const {tx}=settleData();
    const isDone=t=>{const r=S.budget.settled&&S.budget.settled[t.from+'>'+t.to];return !!r&&(r.amt==null||r.amt===t.amt);};
    const done=tx.filter(isDone).length;
    const allDone=tx.length&&done===tx.length;
    sb.innerHTML='<div class="settle-badge '+(allDone?'ok':(tx.length?'wait':'ok'))+'">'+
      (tx.length?(allDone?'✓ 정산 완료':'⏳ 정산 대기 '+(tx.length-done)+'건 · '+won(tx.reduce((a,t)=>a+(isDone(t)?0:t.amt),0)))
                :'✓ 주고받을 돈 없음')+'</div>';
  }
  /* 인원 필터 탭 */
  const tw=$('#expWhoTabs');tw.innerHTML='';
  if(S.members.length){
    if(curExpWho!=='all'&&!memById(curExpWho))curExpWho='all';
    const mk=(id,label)=>{
      const b=document.createElement('button');
      b.className='dchip'+(curExpWho===id?' on':'');b.textContent=label;
      if(curExpWho===id&&id!=='all'){b.style.background=memColor(memIdx(id));}
      b.onclick=()=>{curExpWho=id;renderBudget();};
      tw.appendChild(b);
    };
    mk('all','전체');
    S.members.forEach(m=>mk(m.id,m.name));
  }else{ curExpWho='all'; }

  /* 선택한 사람이 관여한 지출만, 금액은 그 사람 몫으로 */
  const mine=curExpWho!=='all';
  const rows=S.budget.expenses
    .map((e,i)=>({e,i}))
    .filter(({e})=>!mine||(e.shares&&e.shares.includes(curExpWho)));
  const myTotal=rows.reduce((a,{e})=>{
    const n=(e.shares&&e.shares.filter(id=>memById(id)).length)||1;
    return a+(mine?(+e.amount||0)/n:(+e.amount||0));
  },0);
  $('#expCnt').textContent=rows.length||'';

  const w=$('#expList');w.innerHTML='';
  if(!S.budget.expenses.length){w.innerHTML='<div class="empty"><span class="emo">💸</span>아직 지출이 없어요</div>';return;}
  if(!rows.length){w.innerHTML='<div class="empty">'+esc(memName(curExpWho))+'님이 쓴 지출이 없어요</div>';return;}

  if(mine){
    const head=document.createElement('div');
    head.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px;border-bottom:1px solid var(--g50);margin-bottom:4px';
    head.innerHTML='<span style="font-size:13px;font-weight:600;color:var(--g500)">'+esc(memName(curExpWho))+'님이 쓴 금액</span>'+
      '<span style="font-size:17px;font-weight:800">'+won(Math.round(myTotal))+'</span>';
    w.appendChild(head);
  }
  rows.forEach(({e,i})=>{
    const n=(e.shares&&e.shares.filter(id=>memById(id)).length)||1;
    const shown=mine?Math.round((+e.amount||0)/n):(+e.amount||0);
    const split=mine&&n>1;
    const canSettle=!!(e.payer&&memById(e.payer)&&e.shares&&e.shares.filter(id=>memById(id)).length);
    const el=document.createElement('div');el.className='exp-row'+(e.settled?' exp-settled':'');
    el.innerHTML=`
      <div class="exp-ic">${catIcon(e.cat)}</div>
      <div style="flex:1;min-width:0"><div class="exp-name">${esc(e.name)}</div>
        <div class="exp-cat">${esc(e.cat||'기타')}${e.payer&&memById(e.payer)?' · '+esc(memName(e.payer))+' 결제':''}${isShared(e)?' · 공동 '+e.shares.length+'명':(e.shares&&e.shares.length===1&&memById(e.shares[0])?' · 개인':'')}</div>
        ${canSettle?`<button class="sflag ${e.settled?'done':'todo'}" data-a="flag">${e.settled?'✓ 정산 완료':'정산 미완료'}</button>`:''}
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="exp-amt">-${won(shown)}</div>
        ${split?`<div class="exp-who" style="margin-top:1px">${won(+e.amount||0)} ÷ ${n}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <button class="mini" data-a="ed">${ICON_EDIT}</button>
        <button class="mini" data-a="del">${ICON_TRASH}</button>
      </div>`;
    const fb=el.querySelector('[data-a=flag]');
    if(fb)fb.onclick=()=>{e.settled=!e.settled;save();renderBudget();renderSettle();
      toast(e.settled?'정산 완료로 표시했어요':'정산 미완료로 되돌렸어요');};
    el.querySelector('[data-a=ed]').onclick=()=>expForm(i);
    el.querySelector('[data-a=del]').onclick=()=>{S.budget.expenses.splice(i,1);save();renderBudget();renderSettle();};
    w.appendChild(el);
  });
}

/* ---------- 정산 계산 ---------- */
function isShared(e){ return e.shares && e.shares.filter(id=>memById(id)).length>=2; }
function sharedTotal(){ return S.budget.expenses.reduce((a,e)=>a+(isShared(e)?(+e.amount||0):0),0); }
function settleData(){
  const bal={};                                  // 각자 (낸 돈 - 써야 할 돈)
  const shareCost={}, ownCost={};                // 공동에서 내 몫 / 개인 지출
  S.members.forEach(m=>{bal[m.id]=0;shareCost[m.id]=0;ownCost[m.id]=0;});
  let personal={}; S.members.forEach(m=>personal[m.id]=0);
  S.budget.expenses.forEach(e=>{
    const amt=+e.amount||0;
    const payer=e.payer;
    const shares=(e.shares&&e.shares.length)?e.shares.filter(id=>memById(id)):[];
    if(!payer||!memById(payer)||!shares.length)return;   // 정산 대상 아님
    if(e.settled)return;                                  // 이미 정산 끝난 지출은 제외
    bal[payer]+=amt;
    const per=amt/shares.length;
    const shared=shares.length>=2;
    shares.forEach(id=>{ if(bal[id]!=null){
      bal[id]-=per; personal[id]+=per;
      if(shared)shareCost[id]+=per; else ownCost[id]+=per;
    }});
  });
  /* 이미 주고받은 정산은 잔액에서 차감 → 남은 것만 다시 계산돼요 */
  (S.budget.settlements||[]).forEach(t=>{
    if(bal[t.from]!=null)bal[t.from]+=t.amt;
    if(bal[t.to]!=null)bal[t.to]-=t.amt;
  });
  /* 최소 송금 계산 */
  const cred=[],debt=[];
  Object.keys(bal).forEach(id=>{
    const v=Math.round(bal[id]);
    if(v>0)cred.push({id,v});else if(v<0)debt.push({id,v:-v});
  });
  cred.sort((a,b)=>b.v-a.v);debt.sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const amt=Math.min(debt[i].v,cred[j].v);
    if(amt>0)tx.push({from:debt[i].id,to:cred[j].id,amt});
    debt[i].v-=amt;cred[j].v-=amt;
    if(debt[i].v<=0)i++;
    if(cred[j].v<=0)j++;
  }
  return {bal,personal,tx,shareCost,ownCost};
}
function renderSettle(){
  /* 사람 목록 */
  const mw=$('#memList');mw.innerHTML='';
  if(!S.members.length){
    mw.innerHTML='<div class="empty"><span class="emo">👥</span>함께 가는 사람을 추가해 보세요<br>지출을 나눠 계산해 드려요</div>';
  }else{
    S.members.forEach((m,i)=>{
      const el=document.createElement('div');el.className='mem-row';
      el.innerHTML='<span class="avatar" style="background:'+memColor(i)+'">'+esc(m.name.slice(0,1))+'</span>'+
        '<span class="mem-name">'+esc(m.name)+'</span>'+
        '<button class="row-del">'+ICON_TRASH+'</button>';
      el.querySelector('.row-del').onclick=()=>{
        S.members.splice(i,1);
        S.budget.expenses.forEach(e=>{
          if(e.payer===m.id)e.payer='';
          if(e.shares)e.shares=e.shares.filter(x=>x!==m.id);
        });
        save();renderSettle();renderBudget();
      };
      mw.appendChild(el);
    });
  }
  const {bal,personal,tx,shareCost,ownCost}=settleData();
  /* 인당 사용 금액: 공동 분담 몫 + 혼자 쓴 돈 */
  const pl=$('#perList');pl.innerHTML='';
  const shTot=sharedTotal();
  $('#perHint').textContent=S.members.length?'':'';
  if(!S.members.length){
    pl.innerHTML='<div class="empty">사람을 추가하면 인당 사용 금액이 계산돼요</div>';
  }else{
    S.members.forEach((m,i)=>{
      const sh=Math.round(shareCost[m.id]||0), ow=Math.round(ownCost[m.id]||0);
      const el=document.createElement('div');el.className='mem-row';
      el.innerHTML='<span class="avatar" style="background:'+memColor(i)+'">'+esc(m.name.slice(0,1))+'</span>'+
        '<span class="mem-name">'+esc(m.name)+
          '<div class="exp-who">공동 '+won(sh)+' + 개인 '+won(ow)+'</div></span>'+
        '<span class="mem-amt" style="color:var(--g900);font-size:15.5px">'+won(sh+ow)+'</span>';
      pl.appendChild(el);
    });
    const foot=document.createElement('div');
    foot.style.cssText='font-size:12px;color:var(--g400);font-weight:600;padding:12px 0 2px;border-top:1px solid var(--g50);margin-top:6px';
    foot.textContent='공동 지출 합계 '+won(shTot)+' · 인원수로 나눠 계산했어요';
    pl.appendChild(foot);
  }
  /* 누가 얼마 냈나 */
  const pw=$('#paidList');pw.innerHTML='';
  if(!S.members.length){ pw.innerHTML='<div class="empty">사람을 먼저 추가해 주세요</div>'; }
  else{
    const paid={};S.members.forEach(m=>paid[m.id]=0);
    S.budget.expenses.forEach(e=>{ if(paid[e.payer]!=null)paid[e.payer]+=(+e.amount||0); });
    S.members.forEach((m,i)=>{
      const el=document.createElement('div');el.className='mem-row';
      el.innerHTML='<span class="avatar" style="background:'+memColor(i)+'">'+esc(m.name.slice(0,1))+'</span>'+
        '<span class="mem-name">'+esc(m.name)+
          '<div class="exp-who">써야 할 몫 '+won(Math.round(personal[m.id]))+'</div></span>'+
        '<span class="mem-amt">'+won(paid[m.id])+'</span>';
      pw.appendChild(el);
    });
  }
  /* 정산 결과: 지출의 정산 플래그를 기준으로 계산 */
  const sw=$('#settleList');sw.innerHTML='';
  const target=S.budget.expenses.filter(e=>e.payer&&memById(e.payer)&&e.shares&&e.shares.filter(id=>memById(id)).length);
  const unsettled=target.filter(e=>!e.settled);
  const settledCnt=target.length-unsettled.length;
  const unsettledSum=unsettled.reduce((a,e)=>a+(+e.amount||0),0);
  const leftAmt=tx.reduce((a,t)=>a+t.amt,0);

  const badge=document.createElement('div');
  badge.style.cssText='display:flex;align-items:center;gap:8px;padding:0 0 12px;flex-wrap:wrap';
  if(!S.members.length||!target.length){
    badge.innerHTML='<span class="sbadge wait">준비 중</span><span class="sbnote">사람과 지출을 등록하면 계산돼요</span>';
  }else if(!unsettled.length){
    badge.innerHTML='<span class="sbadge ok">정산 완료</span><span class="sbnote">'+target.length+'건 모두 정산했어요</span>';
  }else if(!tx.length){
    badge.innerHTML='<span class="sbadge ok">정산 완료</span><span class="sbnote">더 주고받을 돈이 없어요</span>';
  }else{
    badge.innerHTML='<span class="sbadge todo">정산 필요</span><span class="sbnote">미정산 '+unsettled.length+'건 · '+won(leftAmt)+' 주고받으면 끝나요</span>';
  }
  sw.appendChild(badge);

  if(target.length){
    const head=document.createElement('div');
    head.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 0 10px;border-bottom:1px solid var(--g50);margin-bottom:6px';
    head.innerHTML='<span style="font-size:13px;font-weight:600;color:var(--g500)">'+
        target.length+'건 중 <b style="color:var(--g900)">'+settledCnt+'건</b> 정산 완료'+
        (unsettled.length?' · 미정산 '+won(unsettledSum):'')+'</span>'+
      (unsettled.length?'<button class="chip-add" id="markAll">모두 완료</button>':
        (settledCnt?'<button class="chip-add" id="unmarkAll">모두 해제</button>':''));
    sw.appendChild(head);
    const ma=head.querySelector('#markAll'), ua=head.querySelector('#unmarkAll');
    if(ma)ma.onclick=()=>{target.forEach(e=>e.settled=true);save();renderBudget();renderSettle();toast('모두 정산 완료로 표시했어요');};
    if(ua)ua.onclick=()=>{target.forEach(e=>e.settled=false);save();renderBudget();renderSettle();};
  }

  if(!tx.length){
    const e=document.createElement('div');e.className='empty';
    e.innerHTML='<span class="emo">🤝</span>'+(target.length?'지금은 주고받을 돈이 없어요':'사람과 지출을 등록하면 정산해 드려요');
    sw.appendChild(e);
  }else{
    tx.forEach(t=>{
      const el=document.createElement('div');el.className='settle-row';
      el.innerHTML=avatarHtml(t.from)+'<span>'+esc(memName(t.from))+'</span>'+
        '<span class="arw">→</span>'+avatarHtml(t.to)+'<span>'+esc(memName(t.to))+'</span>'+
        '<span class="amt">'+won(t.amt)+'</span>';
      sw.appendChild(el);
    });
    const note=document.createElement('div');
    note.style.cssText='font-size:11.5px;color:var(--g400);font-weight:500;padding:12px 0 2px;line-height:1.6';
    note.textContent='미정산 지출만 계산한 결과예요. 지출 탭에서 정산이 끝난 항목을 완료로 바꾸면 바로 다시 계산돼요.';
    sw.appendChild(note);
  }
}

/* ---------- 지출 추가/수정 ---------- */
$('#addExpBtn').onclick=()=>expForm(null);
function expForm(idx){
  const edit=idx!=null;
  const o=edit?S.budget.expenses[idx]:null;
  let cat=edit?(o.cat||'기타'):'기타';
  let payer=edit?(o.payer||''):(S.members.length?S.members[0].id:'');
  let shares=edit?(o.shares||[]).slice():S.members.map(m=>m.id);
  openSheet(edit?'지출 수정':'지출 추가',
    '<div class="catpick" id="f-cats" data-kind="budget"></div>'+
    '<div class="field"><span class="lab">내용</span><input id="f-name" value="'+(edit?esc(o.name):'')+'" placeholder="예: 이치란 라멘"></div>'+
    '<div class="field"><span class="lab">금액</span><input id="f-amt" inputmode="numeric" value="'+(edit?(+o.amount||''):'')+'" placeholder="원화 기준 숫자만"></div>'+
    (S.members.length?
      '<div style="font-size:12.5px;font-weight:700;color:var(--g400);padding:6px 4px 8px">누가 냈나요</div>'+
      '<div class="payer-pick" id="f-payer"></div>'+
      '<div style="font-size:12.5px;font-weight:700;color:var(--g400);padding:6px 4px 8px">누가 나눠 쓰나요</div>'+
      '<div class="share-pick" id="f-shares"></div>'+
      '<div style="display:flex;gap:8px;margin:4px 0 14px"><button class="chip-add" id="f-all">모두 선택</button><button class="chip-add" id="f-none">모두 해제</button></div>'
      :'<div style="font-size:12.5px;color:#B0B8C1;padding:6px 4px 14px">정산 탭에서 사람을 추가하면 더치페이 계산도 할 수 있어요</div>')+
    '<button class="btn btn-blue" id="f-save">'+(edit?'저장하기':'추가하기')+'</button>');
  buildCatPick($('#f-cats'), budgetCats, cat, c=>cat=c, v=>S.cats.budget.push(v));
  if(S.members.length){
    const pbox=$('#f-payer'), sbox=$('#f-shares');
    const drawP=()=>{ pbox.innerHTML='';
      S.members.forEach(m=>{ const b=document.createElement('button');
        b.textContent=m.name; if(m.id===payer)b.classList.add('on');
        b.onclick=()=>{payer=m.id;drawP();}; pbox.appendChild(b); }); };
    const drawS=()=>{ sbox.innerHTML='';
      S.members.forEach(m=>{ const b=document.createElement('button');
        const on=shares.includes(m.id);
        b.innerHTML=(on?'✓ ':'')+esc(m.name); if(on)b.classList.add('on');
        b.onclick=()=>{ shares=on?shares.filter(x=>x!==m.id):shares.concat(m.id); drawS(); };
        sbox.appendChild(b); }); };
    drawP();drawS();
    $('#f-all').onclick=()=>{shares=S.members.map(m=>m.id);drawS();};
    $('#f-none').onclick=()=>{shares=[];drawS();};
  }
  $('#f-save').onclick=()=>{
    const name=$('#f-name').value.trim(), amt=+($('#f-amt').value.replace(/[^0-9]/g,''));
    if(!name||!amt){toast('내용과 금액을 입력해 주세요');return;}
    const obj={name,amount:amt,cat,payer,shares:shares.slice()};
    if(edit){
      const changed=(+o.amount!==+obj.amount)||(o.payer!==obj.payer)||
        JSON.stringify((o.shares||[]).slice().sort())!==JSON.stringify((obj.shares||[]).slice().sort());
      obj.settled=changed?false:!!o.settled;   // 금액·분담이 바뀌면 다시 미정산으로
      S.budget.expenses[idx]=obj;
      if(changed&&o.settled)toast('금액이 바뀌어 정산 미완료로 되돌렸어요');
    } else S.budget.expenses.unshift(obj);
    save();closeSheet();renderBudget();renderSettle();
    if(edit)toast('수정했어요 · 정산 결과에 바로 반영됐어요');
  };
}

const DOC_CATS=['전체','✈️ 항공권','🏨 호텔','🎫 티켓·예약','🚌 교통·공항버스','📌 기타'];
function docCats(){return [...DOC_CATS.slice(1), ...S.cats.docs.map(c=>'🏷️ '+c)];}
function renderDocs(){
  const tw=$('#docTabs');tw.innerHTML='';
  ['전체',...docCats()].forEach(c=>{
    const b=document.createElement('button');
    b.className='dchip'+(c===curDocCat?' on':'');b.textContent=c;
    b.onclick=()=>{curDocCat=c;renderDocs();};
    tw.appendChild(b);
  });
  const list=curDocCat==='전체'?S.docs:S.docs.filter(d=>d.cat===curDocCat);
  const w=$('#docList');w.innerHTML='';
  if(!list.length){w.innerHTML='<div class="card"><div class="empty"><span class="emo">🎒</span>저장된 정보가 없어요<br>항공권 예약번호, 호텔 체크인, 공항버스 시간표…<br>여행에 필요한 걸 모두 모아두세요</div></div>';return;}
  list.forEach(d=>{
    const i=S.docs.indexOf(d);
    const el=document.createElement('div');el.className='card';
    el.innerHTML=`
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11.5px;font-weight:700;color:#3182F6;margin-bottom:4px">${esc(d.cat)}</div>
          <div style="font-size:16px;font-weight:700">${esc(d.title)}</div>
          ${d.memo?`<div class="memoline">${esc(d.memo)}</div>`:''}
          ${d.link?`<a class="linkline" href="${esc(d.link)}" target="_blank" rel="noopener">${ICON_LINK}<span>${esc(hostOf(d.link))}</span></a>`:''}
          ${d.img?`<img class="thumb" src="${d.img}" alt="">`:''}
        </div>
        <button class="row-del">${ICON_TRASH}</button>
      </div>`;
    el.querySelector('.row-del').onclick=()=>{S.docs.splice(i,1);save();renderDocs();};
    w.appendChild(el);
  });
}

/* 공유: join_secret이 담긴 초대 링크 생성 */
$('#shareBtn').onclick=async()=>{
  if(!cloudOn()){
    openSheet('링크 공유','<div style="font-size:13.5px;color:#6B7684;line-height:1.7;padding:4px 4px 16px">아직 이 기기에만 저장되고 있어요.<br>같이 쓰려면 파일 상단의 <b style="color:#191F28">SUPABASE_URL</b>과 <b style="color:#191F28">SUPABASE_KEY</b>를 설정해 주세요.</div><button class="btn btn-grey" onclick="closeSheet()">닫기</button>');
    return;
  }
  let url=location.href;
  try{
    const r=await api('/rest/v1/trips?code=eq.'+encodeURIComponent(CODE)+'&select=join_secret');
    const rows=await r.json();
    if(rows[0]&&rows[0].join_secret){
      const u=new URL(location.href);
      u.searchParams.set('trip',CODE);u.searchParams.set('k',rows[0].join_secret);
      url=u.toString();
    }
  }catch(e){}
  openSheet('함께 보기',
    '<div style="font-size:13.5px;color:#6B7684;line-height:1.7;padding:0 4px 14px">이 링크를 받은 사람이 <b style="color:#191F28">각자 아이디로 로그인</b>하면 이 여행을 함께 보고 수정할 수 있어요.</div>'+
    '<div class="field"><input id="sh-url" value="'+esc(url)+'" readonly></div>'+
    '<button class="btn btn-blue" id="sh-copy">링크 복사하기</button>'+
    '<button class="btn btn-grey" style="margin-top:8px" onclick="closeSheet()">닫기</button>');
  $('#sh-url').onclick=function(){this.select();};
  $('#sh-copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); closeSheet(); }
    catch(e){ $('#sh-url').select(); toast('링크를 길게 눌러 복사해 주세요'); }
  };
};

  const listed=curFoodCat==='전체'?S.food:S.food.filter(f=>f.cat===curFoodCat);
  fitPoints(foodMap,listed.filter(f=>f.lat!=null),15);
};

/* ---------- 시작 ---------- */
let booted=false;
function boot(){
  $('#tripTitle').value=S.title||'';
  if(booted){ renderPlan();renderFood();renderShop();renderBudget();renderDocs(); return; }
  booted=true;
  loadGmaps();
  renderPlan();renderFood();renderShop();renderBudget();renderDocs();
  addTripSwitcher();
}

(async()=>{
  if(!cloudOn()){ CODE='local'; await load(); boot(); return; }
  initAuthUI();
  loadSession();
  if(session&&session.access_token){
    myName=fromEmail(session.user&&session.user.email);
    try{ await afterLogin(); }
    catch(e){
      /* 인증이 실제로 끊긴 경우에만 로그인 화면으로, 일시적 오류면 유지 */
      const dead=!session||!session.access_token;
      if(dead){ clearSession(); showGate('#authGate'); }
      else { showGate(null); await load(); boot(); toast('연결이 불안정해요. 잠시 후 다시 동기화돼요'); }
    }
  }else{
    showGate('#authGate');
  }
})();
</script>
</body>
</html>
